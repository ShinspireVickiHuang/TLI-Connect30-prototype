<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Connect 3.0 會員區－請假／改期</title>
<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.back-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--c-border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--c-text);flex:none;cursor:pointer;}
.back-btn svg{width:16px;height:16px;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.mini-select{border:1px solid var(--c-border);border-radius:6px;padding:4px 6px;font-size:11.5px;background:#fff;color:var(--c-muted);font-family:inherit;max-width:96px;}
/* ---------- 示範用：身分切換（僅供內部展示，非正式功能） ---------- */
.demo-switch{border-style:dashed;color:var(--c-accent-dark);font-weight:700;max-width:118px;cursor:pointer;}
.role-switch-wrap{position:relative;}
.role-menu{display:none;position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:4px;z-index:90;min-width:104px;}
.role-menu.open{display:block;}
.role-menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;font-size:12.5px;color:var(--c-text);cursor:pointer;border-radius:6px;font-family:inherit;}
.role-menu button:hover{background:var(--c-bg);}
.role-menu-wrap{min-width:136px;}
.role-menu-sep{height:1px;background:var(--c-border);margin:4px 2px;}
.role-menu-label{font-size:10.5px;color:var(--c-muted);font-weight:700;padding:6px 10px 2px;}
.bell-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-muted);}
.bell-btn svg{width:16px;height:16px;}
.bell-btn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.bell-panel{display:none;position:absolute;right:0;top:40px;width:264px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px 0;z-index:90;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:0;padding:8px 14px 6px;font-size:12.5px;color:var(--c-muted);font-weight:700;}
.bell-item{padding:9px 14px;font-size:12.5px;border-top:1px solid var(--c-border);display:flex;gap:8px;}
.bell-item .b-dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);margin-top:5px;flex:none;}
.bell-item p{margin:0;color:var(--c-text);}
.bell-item span{color:var(--c-muted);font-size:11px;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;}
  .side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:22px;height:22px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:960px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 18px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card,.card + .class-card,.class-card + .card,.class-card + .class-card{margin-top:12px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.stack{display:flex;flex-direction:column;gap:10px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.divider{border:none;border-top:1px solid var(--c-border);margin:14px 0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn-danger-outline{background:#fff;border:1px solid #F5B0A6;color:#B42318;}
.btn:disabled{background:var(--c-border)!important;color:#98A2B3!important;cursor:not-allowed;border-color:var(--c-border)!important;}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
.btn-block{width:100%;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.hidden{display:none!important;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
.sheet-overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet-overlay.hidden{display:none;}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0));max-height:86vh;overflow-y:auto;animation:sheetUp .18s ease-out;}
@keyframes sheetUp{from{transform:translateY(16px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--c-border);border-radius:4px;margin:0 auto 14px;}
.sheet h3{margin:0 0 4px;font-size:16px;}
@media(min-width:640px){.sheet-overlay{align-items:center;}.sheet{border-radius:16px;}}
.explore-link{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--c-primary);white-space:nowrap;padding:4px 2px;flex:none;}
.explore-link svg{width:15px;height:15px;flex:none;}
@media(max-width:639px){.explore-link-text{display:none;}}
/* ---------- 請假／改期規則卡（一般學員用一般卡，企業學員用強調卡） ---------- */
.enterprise-bar{background:#EAF6F2;border:1px solid #BEE6D9;border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.demo-tag{font-size:10.5px;color:#98A2B3;font-weight:400;}
.rule-list{margin:0;padding-left:18px;font-size:13px;}
.rule-list li{margin-bottom:6px;}
.rule-list li:last-child{margin-bottom:0;}
.inst-stat{background:#fff;border:1px solid #BEE6D9;border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;color:#0B6B52;margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.inst-stat b{font-size:14px;color:#075A45;}
/* ---------- 課堂卡 ---------- */
.class-card .cc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.class-card h4{margin:8px 0 4px;font-size:15.5px;}
.class-card .cc-actions{display:flex;flex-direction:column;gap:8px;margin-top:2px;}
.class-card .cc-reason{color:var(--c-muted);margin:8px 0 0;}
.class-card .cc-positive{color:#0B6B52;margin:8px 0 0;}
.class-card .cc-done{font-weight:700;margin:0;}
/* ---------- 請假紀錄：表格化列表 ---------- */
.records-summary{font-size:12.5px;color:var(--c-muted);margin:8px 0 12px;}
.records-summary b{color:var(--c-text);}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.filter-select{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:8px 10px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--c-text);min-height:36px;}
.lr-head-row{display:none;font-size:11.5px;color:var(--c-muted);font-weight:700;padding:0 13px;margin-bottom:6px;}
@media(min-width:640px){.lr-head-row{display:grid;grid-template-columns:92px 1fr 76px 1fr;gap:10px;}}
.leave-record-row{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:10px 13px;}
.leave-record-row + .leave-record-row{margin-top:8px;}
.leave-record-row .lr-line1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.leave-record-row .lr-date{font-size:11.5px;color:var(--c-muted);}
.leave-record-row .lr-line2{font-size:12.5px;margin-top:4px;}
.leave-record-row .lr-line2 strong{font-weight:700;}
.leave-record-row .lr-note{font-size:11.5px;color:var(--c-muted);margin-top:2px;}
.lr-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;flex:none;}
.lr-badge-ok{background:#E4F5F0;color:#0B6B52;}
.lr-badge-pending{background:#FCEBDC;color:#9A4A0F;}
.lr-badge-deduct{background:#FBEAEA;color:#912018;}
.load-more-wrap{text-align:center;margin-top:12px;}
/* ---------- 改期：月曆＋時段（比照公開網站 p06_trial 手刻月曆樣式與邏輯） ---------- */
.slot-calendar{border:1px solid var(--c-border);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-title{font-size:14.5px;font-weight:700;}
.cal-nav-btn{border:1px solid var(--c-border);background:#fff;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c-text);padding:0;flex:none;}
.cal-nav-btn:hover{background:var(--c-bg);}
.cal-nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.cal-weekday-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px;}
.cal-weekday-row span{text-align:center;font-size:12px;color:var(--c-muted);font-weight:600;padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.cal-day{position:relative;aspect-ratio:1/1;border:1px solid transparent;background:none;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;color:var(--c-text);display:flex;align-items:center;justify-content:center;min-height:34px;padding:0;}
.cal-day:hover:not(:disabled){background:var(--c-bg);}
.cal-day.cal-day-available::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--c-accent);}
.cal-day:disabled{color:#D0D5DD;cursor:not-allowed;background:none;}
.cal-day.cal-day-active{background:var(--c-primary);border-color:var(--c-primary);color:#fff;font-weight:700;}
.cal-day.cal-day-active::after{background:#fff;}
.cal-day.cal-day-current{border-color:var(--c-accent);color:var(--c-accent-dark);font-weight:700;}
.cal-day-empty{visibility:hidden;pointer-events:none;}
@media(max-width:480px){.cal-day{font-size:12px;min-height:30px;}.cal-nav-btn{width:28px;height:28px;}}
.chip-opt{border:1px solid var(--c-border);background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;min-height:38px;color:var(--c-text);}
.chip-opt:hover{background:var(--c-bg);}
.chip-opt.active{background:var(--c-primary);border-color:var(--c-primary);color:#fff;font-weight:700;}
.slot-times{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.slot-hint{font-size:12px;color:var(--c-muted);margin-bottom:8px;}
.selected-slot-line{font-size:13px;font-weight:700;color:var(--c-secondary);background:#E6F4EF;border-radius:8px;padding:9px 13px;display:none;margin-bottom:10px;}
.reschedule-current-line{font-size:12.5px;color:var(--c-muted);margin:0 0 10px;}
.reschedule-current-line b{color:var(--c-text);}
</style>
</head>

  </nav>

  <header class="topbar">
    <div class="topbar-left">
      <a class="topbar-logo-wrap" href="../公開網站/p01_home.html" aria-label="TLI 官網"><img src="../assets/tli-logo.svg" alt="TLI"></a>
      <button class="back-btn" onclick="if(history.length>1){history.back();}else{location.href='m03_schedule.html';}" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="topbar-title" data-i18n-zh="請假／改期" data-i18n-en="Leave / Reschedule">請假／改期</div>
    </div>
    <div class="topbar-actions">
      <div class="role-switch-wrap" id="roleSwitchWrap">
        <button type="button" class="mini-select demo-switch" id="roleSwitchBtn" aria-haspopup="listbox" aria-expanded="false" title="示範：切換身分（正式版依登入身分自動判斷）" onclick="toggleRoleMenu()">示範：<span id="roleSwitchLabel">一般學員</span></button>
        <div class="role-menu role-menu-wrap" id="roleMenu" role="listbox">
          <button type="button" role="option" onclick="switchRole('b2c')">一般學員</button>
          <button type="button" role="option" onclick="switchRole('b2b')">企業學員</button>
          <button type="button" role="option" onclick="switchRole('inst')">機構學生</button>
          <div class="role-menu-sep hidden" id="approvalMenuSep"></div>
          <div class="hidden" id="approvalMenuSub">
            <div class="role-menu-label">審核模式（企業合約）</div>
            <button type="button" role="option" onclick="switchApproval('self')">自動核准</button>
            <button type="button" role="option" onclick="switchApproval('hr')">HR 核准</button>
            <button type="button" role="option" onclick="switchApproval('reschedule')">僅可改期</button>
          </div>
        </div>
      </div>
      <a class="explore-link" href="../公開網站/p02_courses.html" aria-label="探索課程" title="探索課程">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        <span class="explore-link-text">探索課程</span>

function classifyBadge(r){
  if(r.result.indexOf('審核中')>-1 || r.result.indexOf('核准')>-1) return 'lr-badge-pending';
  if(r.result.indexOf('扣 1 堂')>-1 || r.result.indexOf('記缺席')>-1) return 'lr-badge-deduct';
  return 'lr-badge-ok';
}
function fmtRecDate(d){
  var wd='日一二三四五六';
  return (d.getMonth()+1)+'/'+String(d.getDate()).padStart(2,'0')+'（'+wd.charAt(d.getDay())+'）';
}
var recordVisibleCount=10;
function onRecordFilterChange(){ recordVisibleCount=10; renderRecords(getRole()); }
function loadMoreRecords(){ recordVisibleCount+=10; renderRecords(getRole()); }
function getPeriodCutoff(){
  var v=document.getElementById('filterPeriod').value;
  if(v==='30') return new Date(NOW.getTime()-30*86400000);
  if(v==='90') return new Date(NOW.getTime()-90*86400000);
  return null;
}
function renderRecords(role){
  var all = role==='b2c' ? RECORDS_B2C : (role==='b2b' ? RECORDS_B2B : RECORDS_INST);

  var monthStart=new Date(NOW.getFullYear(),NOW.getMonth(),1);
  var leaveCount=all.filter(function(r){return r.action==='請假' && r.date>=monthStart;}).length;
  var cancelCount=all.filter(function(r){return r.action==='取消' && r.date>=monthStart;}).length;
  document.getElementById('recordsSummary').innerHTML='本月請假 <b>'+leaveCount+'</b> 次、取消 <b>'+cancelCount+'</b> 次';

  var periodCutoff=getPeriodCutoff();
  var methodVal=document.getElementById('filterMethod').value;
  var filtered=all.filter(function(r){
    if(periodCutoff && r.date<periodCutoff) return false;
    if(methodVal!=='all' && r.action!==methodVal) return false;
    return true;
  }).sort(function(a,b){ return b.date-a.date; });

  var wrap=document.getElementById('leaveRecordList');
  var moreBtn=document.getElementById('loadMoreBtn');
  if(filtered.length===0){
    wrap.innerHTML='<p class="small muted">目前沒有符合條件的請假紀錄。</p>';
    moreBtn.classList.add('hidden');
    return;
  }
  var shown=filtered.slice(0, recordVisibleCount);
  wrap.innerHTML=shown.map(function(r){
    return '<div class="leave-record-row">'+
      '<div class="lr-line1"><span class="lr-date">'+fmtRecDate(r.date)+'</span><span class="lr-badge '+classifyBadge(r)+'">'+r.action+'</span></div>'+
      '<div class="lr-line2"><strong>'+r.title+'</strong>－'+r.result+'</div>'+
      (r.note?'<div class="lr-note">'+r.note+'</div>':'')+
    '</div>';

function fmtHours(h){ return Math.max(0,Math.round(h)); }

function buildB2CActions(cls){
  if(cls.cancelled) return '<p class="cc-done" style="color:#0B6B52;">已取消，堂數已退回。</p>';
  if(cls.leaveSubmitted) return '<p class="cc-done" style="color:#9A4A0F;">已送出請假，堂數不退，已通知老師。</p>';

    html+='<button class="btn btn-danger-outline btn-block" onclick="requestB2CCancel(\''+cls.id+'\')">取消（退回堂數）</button>';

    }
    html+='</div><p class="cc-positive small">距開課還有約 '+fmtHours(hoursUntil)+' 小時，取消或改期可退回堂數。</p>';

    '<div class="cc-actions">'+
      '<button class="btn btn-primary btn-block" onclick="openB2CLeaveSheet(\''+cls.id+'\')">請假通知老師（堂數不退）</button>'+

/* ================= 改期：原地月曆＋時段（比照公開網站 p06_trial 手刻月曆） ================= */
var SLOT_POOL=['09:00','09:30','10:00','10:30','11:00','13:30','14:00','14:30','15:30','16:00','16:30','19:00','19:30','20:00'];
var CAL_WEEKDAYS=['一','二','三','四','五','六','日'];
var calViewYear=null, calViewMonth=null, calSelectedDate=null;
var currentReschedule=null;
var pickedSlotTime=null, pickedSlotEnd=null;

function getRescheduleClass(){
  if(!currentReschedule) return null;
  var list=currentReschedule.role==='b2c'?B2C_CLASSES:(currentReschedule.role==='b2b'?B2B_CLASSES:INST_CLASSES);
  return list.filter(function(x){return x.id===currentReschedule.id;})[0];
}
function calToday(){ return new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()); }
function calSameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function calDateHasSlots(d){
  var today=calToday();
  if(d<today) return false;
  var day=d.getDay();
  return day!==0 && day!==6;
}
function calSeedFromDate(d){ return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function calSlotsForDate(d){
  if(!calDateHasSlots(d)) return [];
  var seed=calSeedFromDate(d);
  var count=3+(seed%4);
  var start=seed%SLOT_POOL.length;
  var picks=[];
  for(var i=0;i<count;i++){ picks.push(SLOT_POOL[(start+i*2)%SLOT_POOL.length]); }
  picks=Array.from(new Set(picks)).sort();
  return picks;
}
function calAddMinutes(hhmm,minutes){
  var parts=hhmm.split(':'); var h=parseInt(parts[0],10); var m=parseInt(parts[1],10);
  var total=((h*60+m+minutes)%(24*60)+24*60)%(24*60);
  var nh=Math.floor(total/60), nm=total%60;
  return (nh<10?'0':'')+nh+':'+(nm<10?'0':'')+nm;
}
function fmtSlotDayLabel(d){
  var wd='日一二三四五六';
  return (d.getMonth()+1)+'/'+String(d.getDate()).padStart(2,'0')+'（'+wd.charAt(d.getDay())+'）';
}
function renderCalendar(){
  document.getElementById('calTitle').textContent=calViewYear+' 年 '+(calViewMonth+1)+' 月';
  var weekRow=document.getElementById('calWeekdayRow');
  weekRow.innerHTML=CAL_WEEKDAYS.map(function(w){return '<span>'+w+'</span>';}).join('');
  var grid=document.getElementById('calGrid');
  grid.innerHTML='';
  var firstDay=new Date(calViewYear,calViewMonth,1);
  var startOffset=(firstDay.getDay()+6)%7;
  var daysInMonth=new Date(calViewYear,calViewMonth+1,0).getDate();
  var rcls=getRescheduleClass();
  var origStart=rcls?rcls.start:null;
  for(var i=0;i<startOffset;i++){
    var empty=document.createElement('div');
    empty.className='cal-day cal-day-empty';
    grid.appendChild(empty);
  }
  for(var day=1; day<=daysInMonth; day++){
    (function(day){
      var d=new Date(calViewYear,calViewMonth,day);
      var hasSlots=calDateHasSlots(d);
      var btn=document.createElement('button');
      btn.type='button';
      var cname='cal-day'+(hasSlots?' cal-day-available':'');
      if(calSelectedDate && calSameDate(calSelectedDate,d)) cname+=' cal-day-active';
      if(origStart && calSameDate(origStart,d)) cname+=' cal-day-current';
      btn.className=cname;
      btn.textContent=String(day);
      if(!hasSlots){ btn.disabled=true; }
      else{ btn.onclick=function(){ selectCalDate(d); }; }
      grid.appendChild(btn);
    })(day);
  }
}
function calChangeMonth(delta){
  calViewMonth+=delta;
  if(calViewMonth<0){ calViewMonth=11; calViewYear-=1; }
  if(calViewMonth>11){ calViewMonth=0; calViewYear+=1; }
  renderCalendar();
}
function selectCalDate(d){
  calSelectedDate=d;
  pickedSlotTime=null; pickedSlotEnd=null;
  renderCalendar();
  renderSlotTimes();
}
function renderSlotTimes(){
  var wrap=document.getElementById('slotTimes');
  var hintEl=document.getElementById('slotTimesHint');
  wrap.innerHTML='';
  document.getElementById('confirmRescheduleBtn').disabled=true;
  if(!calSelectedDate){
    hintEl.textContent='請先在月曆選擇日期';
    hintEl.style.display='block';
    document.getElementById('selectedSlotLine').style.display='none';
    return;
  }
  var times=calSlotsForDate(calSelectedDate);
  hintEl.style.display='none';
  times.forEach(function(t){
    var end=calAddMinutes(t,30);
    var b=document.createElement('button');
    b.type='button'; b.className='chip-opt slot-time-chip';
    if(t===pickedSlotTime) b.classList.add('active');
    b.textContent=t+'–'+end;
    b.onclick=function(){ selectSlotTime(t,end); };
    wrap.appendChild(b);
  });
  var line=document.getElementById('selectedSlotLine');
  if(pickedSlotTime && pickedSlotEnd){
    var rcls=getRescheduleClass();
    line.textContent='原：'+rcls.time+' → 新：'+fmtSlotDayLabel(calSelectedDate)+' '+pickedSlotTime+'–'+pickedSlotEnd;
    line.style.display='block';
  }else{
    line.style.display='none';
  }
}
function selectSlotTime(t,end){
  pickedSlotTime=t; pickedSlotEnd=end;
  renderSlotTimes();
  document.getElementById('confirmRescheduleBtn').disabled=false;
}
function openRescheduleSheet(id, role){
  var list = role==='b2c'?B2C_CLASSES:(role==='b2b'?B2B_CLASSES:INST_CLASSES);
  var cls=list.filter(function(x){return x.id===id;})[0];
  if(!cls) return;
  currentReschedule={id:id, role:role};
  document.getElementById('rescheduleSheetMeta').textContent=cls.title+(cls.teacher?('・老師：'+cls.teacher):'');
  document.getElementById('rescheduleCurrentLine').innerHTML='目前：<b>'+cls.time+'</b>';
  var limitLine=document.getElementById('rescheduleLimitLine');
  if(role==='b2c'){
    limitLine.classList.remove('hidden');
    limitLine.textContent='本堂可改期次數剩 '+cls.rescheduleRemain+'（待定）';
  }else{
    limitLine.classList.add('hidden');
  }
  calSelectedDate=null;
  pickedSlotTime=null; pickedSlotEnd=null;
  calViewYear=cls.start.getFullYear();
  calViewMonth=cls.start.getMonth();
  document.getElementById('confirmRescheduleBtn').disabled=true;
  document.getElementById('selectedSlotLine').style.display='none';
  renderCalendar();
  renderSlotTimes();
  document.getElementById('rescheduleOverlay').classList.remove('hidden');
}
function closeRescheduleSheet(){
  document.getElementById('rescheduleOverlay').classList.add('hidden');
  currentReschedule=null;
}
function confirmReschedule(){
  if(!currentReschedule || !calSelectedDate || !pickedSlotTime) return;
  var role=currentReschedule.role;
  var cls=getRescheduleClass();
  if(!cls) return;
  var oldTime=cls.time;
  var newDateLabel=fmtSlotDayLabel(calSelectedDate);
  var hh=parseInt(pickedSlotTime.split(':')[0],10), mm=parseInt(pickedSlotTime.split(':')[1],10);
  cls.start=new Date(calSelectedDate.getFullYear(),calSelectedDate.getMonth(),calSelectedDate.getDate(),hh,mm);
  cls.time=newDateLabel+' '+pickedSlotTime+'–'+pickedSlotEnd;
  if(role==='b2c' && typeof cls.rescheduleRemain==='number'){
    cls.rescheduleRemain=Math.max(0,cls.rescheduleRemain-1);
  }
  addRecord(role,{date:new Date(NOW),title:cls.title,action:'改期',result:'已改期至 '+cls.time,note:'原時段：'+oldTime});
  showToast('已改期，新時段已更新');
  closeRescheduleSheet();
  pickedSlotTime=null; pickedSlotEnd=null;
  renderClassCards(role);
  renderRecords(role);
}

/* ================= 初始化 ================= */
function render(){
  var role=getRole();
  var roleLabels={b2c:'一般學員',b2b:'企業學員',inst:'機構學生'};
  var approvalLabels={self:'自動核准',hr:'HR 核准',reschedule:'僅可改期'};
  var labelEl=document.getElementById('roleSwitchLabel');
  if(labelEl){
    var mode=getApprovalMode();
    labelEl.textContent=roleLabels[role]+(role==='b2b'?'・'+approvalLabels[mode]:'');
  }
  document.getElementById('approvalMenuSep').classList.toggle('hidden', role!=='b2b');
  document.getElementById('approvalMenuSub').classList.toggle('hidden', role!=='b2b');
  renderRuleCard(role);
  renderClassCards(role);
  renderRecords(role);
}
render();
</script>
<div class="toast hidden" id="toast">已完成</div>
</body>
</html>
