<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Connect 3.0 會員區－線上測驗</title>
<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.back-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--c-border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--c-text);flex:none;cursor:pointer;}
.back-btn svg{width:16px;height:16px;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.mini-select{border:1px solid var(--c-border);border-radius:6px;padding:4px 6px;font-size:11.5px;background:#fff;color:var(--c-muted);font-family:inherit;max-width:96px;}
.bell-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-muted);}
.bell-btn svg{width:16px;height:16px;}
.bell-btn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.bell-panel{display:none;position:absolute;right:0;top:40px;width:264px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px 0;z-index:90;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:0;padding:8px 14px 6px;font-size:12.5px;color:var(--c-muted);font-weight:700;}
.bell-item{padding:9px 14px;font-size:12.5px;border-top:1px solid var(--c-border);display:flex;gap:8px;}
.bell-item .b-dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);margin-top:5px;flex:none;}
.bell-item p{margin:0;color:var(--c-text);}
.bell-item span{color:var(--c-muted);font-size:11px;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;}
  .side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:22px;height:22px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:960px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-h{font-size:19px;font-weight:700;margin:2px 0 4px;}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 18px;}
.section-title{font-size:15px;font-weight:700;margin:24px 0 12px;}
.section-title.first{margin-top:4px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card{margin-top:12px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.stack{display:flex;flex-direction:column;gap:10px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.divider{border:none;border-top:1px solid var(--c-border);margin:14px 0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-accent{background:var(--c-accent);color:#fff;}
.btn-accent:hover{background:var(--c-accent-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn-ghost{background:none;color:var(--c-muted);}
.btn:disabled{background:var(--c-border)!important;color:#98A2B3!important;cursor:not-allowed;border-color:var(--c-border)!important;}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
.btn-block{width:100%;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.badge-warn{background:#FCEBDC;color:var(--c-accent-dark);}
.badge-ok{background:#E4F5F0;color:#0B6B52;}
.badge-muted{background:var(--c-border);color:var(--c-muted);}
.badge-full{background:#FBEAEA;color:#B42318;}
.progress{height:8px;border-radius:6px;background:var(--c-border);overflow:hidden;}
.progress > div{height:100%;background:var(--c-primary);border-radius:6px;transition:width .25s;}
.progress.warn > div{background:var(--c-accent);}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--c-border);}
.list-row:first-child{border-top:none;padding-top:0;}
.list-row .icon-box{width:38px;height:38px;border-radius:9px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--c-primary);}
.list-row .icon-box svg{width:18px;height:18px;}
.list-row .body{flex:1;min-width:0;}
.list-row .body h4{margin:0;font-size:13.5px;font-weight:700;}
.list-row .body p{margin:2px 0 0;font-size:12px;color:var(--c-muted);}
.list-row .trail{flex:none;text-align:right;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--c-border);margin:18px 0 14px;overflow-x:auto;}
.tab-btn{padding:9px 14px;border:none;background:none;font-size:13.5px;font-weight:700;color:var(--c-muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;min-height:40px;}
.tab-btn.active{color:var(--c-primary);border-color:var(--c-primary);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:9px;align-items:flex-start;}
.banner-success{background:#E4F5F0;color:#0B6B52;border:1px solid #BEE6D9;}
.banner-warn{background:#FCEBDC;color:#9A4A0F;border:1px solid #F5CBA1;}
.banner-info{background:#E6EEF8;color:var(--c-primary-dark);border:1px solid #C7DAF0;}
.hidden{display:none!important;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.field label{font-size:13px;font-weight:700;}
.field textarea{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:10px 11px;font-size:14px;font-family:inherit;color:var(--c-text);background:#fff;width:100%;resize:vertical;}
.explore-link{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--c-primary);white-space:nowrap;padding:4px 2px;flex:none;}
.explore-link svg{width:15px;height:15px;flex:none;}
@media(max-width:639px){.explore-link-text{display:none;}}
.sheet-overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet-overlay.hidden{display:none;}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0));max-height:86vh;overflow-y:auto;animation:sheetUp .18s ease-out;}
@keyframes sheetUp{from{transform:translateY(16px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--c-border);border-radius:4px;margin:0 auto 14px;}
.sheet h3{margin:0 0 4px;font-size:16px;}
@media(min-width:640px){.sheet-overlay{align-items:center;}.sheet{border-radius:16px;}}
.skill-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.skill-row .skill-label{width:34px;flex:none;font-size:13px;font-weight:700;}
.skill-row .progress{flex:1;}
.skill-row .skill-score{width:56px;flex:none;text-align:right;font-size:12.5px;color:var(--c-muted);font-weight:700;}

/* ---------- 線上測驗專用 ---------- */
.quiz-card{cursor:default;}
.back-list-btn{margin-bottom:12px;}
.q-topbar{position:sticky;top:var(--topbar-h);z-index:40;background:#F5F7FA;padding:14px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;}
@media(min-width:1024px){.q-topbar{margin:0;padding-left:0;padding-right:0;}}
.q-progress-row{display:flex;align-items:center;gap:10px;}
.q-progress-row .progress{flex:1;}
.q-timer{flex:none;font-size:14px;font-weight:700;color:var(--c-primary);background:#E6EEF8;border-radius:20px;padding:4px 12px;white-space:nowrap;}
.q-timer.low{color:#B42318;background:#FBEAEA;}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px;}
.qnav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--c-border);background:#fff;font-size:12.5px;font-weight:700;color:var(--c-muted);cursor:pointer;position:relative;font-family:inherit;}
.qnav button.answered{background:#E4F5F0;border-color:#BEE6D9;color:#0B6B52;}
.qnav button.current{border-color:var(--c-primary);color:var(--c-primary);box-shadow:0 0 0 2px #E6EEF8;}
.qnav button.flagged::after{content:'';position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.q-type-badge{margin-bottom:8px;}
.q-text{font-size:15.5px;font-weight:700;margin:6px 0 16px;}
.option-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--c-border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;font-size:13.5px;}
.option-row:hover{border-color:var(--c-primary);}
.option-row.selected{border-color:var(--c-primary);background:#F7FAFF;}
.option-row .opt-mark{width:18px;height:18px;flex:none;border:1.5px solid var(--c-border);display:flex;align-items:center;justify-content:center;color:#fff;}
.option-row.selected .opt-mark{background:var(--c-primary);border-color:var(--c-primary);}
.option-row .opt-mark svg{width:12px;height:12px;}
.opt-mark.circle{border-radius:50%;}
.opt-mark.square{border-radius:4px;}
.fill-input{width:100%;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:11px 12px;font-size:14px;font-family:inherit;}
.fill-input:focus{border-color:var(--c-primary);}
.listen-box{background:var(--c-bg);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.listen-play{width:44px;height:44px;border-radius:50%;background:var(--c-primary);color:#fff;border:none;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;}
.listen-play svg{width:18px;height:18px;}
.listen-box.playing .listen-play{background:var(--c-accent);}
.listen-meta{flex:1;min-width:0;}
.listen-meta .lm-title{font-size:12.5px;font-weight:700;color:var(--c-text);margin-bottom:6px;}
.listen-track{height:5px;border-radius:4px;background:var(--c-border);overflow:hidden;}
.listen-track > div{height:100%;width:0%;background:var(--c-primary);transition:width .1s linear;}
.q-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap;}
.flag-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--c-muted);cursor:pointer;font-family:inherit;min-height:40px;}
.flag-btn svg{width:14px;height:14px;}
.flag-btn.on{color:var(--c-accent-dark);border-color:#F5CBA1;background:#FCEBDC;}
.result-score-wrap{text-align:center;padding:8px 0 4px;}
.result-score{font-size:44px;font-weight:800;color:var(--c-primary);line-height:1;}
.result-score span{font-size:18px;color:var(--c-muted);font-weight:700;}
.review-item{border-top:1px solid var(--c-border);padding:12px 0;}
.review-item:first-child{border-top:none;padding-top:0;}
.review-head{display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
.review-head .icon-box{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;}
.review-head .icon-box.ok{background:#E4F5F0;color:#0B6B52;}
.review-head .icon-box.no{background:#FBEAEA;color:#B42318;}
.review-head .icon-box svg{width:15px;height:15px;}
.review-head p{margin:0;font-size:13.5px;font-weight:600;flex:1;}
.review-detail{display:none;margin:8px 0 0 40px;font-size:12.5px;color:var(--c-muted);background:var(--c-bg);border-radius:var(--radius-sm);padding:10px 12px;}
.review-detail.open{display:block;}
.review-detail p{margin:0 0 4px;color:var(--c-muted);font-size:12.5px;font-weight:400;}
.review-detail strong{color:var(--c-text);}
</style>
</head>
<body>
<div class="app has-side">
  <nav class="side-nav" aria-label="主導覽">
    <div class="side-brand"><a href="../公開網站/p01_home.html" aria-label="TLI 官網"><img src="../assets/tli-logo.svg" alt="TLI"></a></div>
    <a class="side-link" href="m01_home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10"/></svg>首頁</a>
    <a class="side-link" href="m02_booking.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v6M9 17h6"/></svg>預約</a>
    <a class="side-link" href="m03_schedule.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>課表</a>
    <a class="side-link" href="m08_self_paced.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>自學課程</a>
    <a class="side-link active" href="m09_assessment.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-3"/><path d="M9 14l2 2 4-4"/></svg>評量</a>
    <a class="side-link" href="m10_events.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>活動</a>
    <a class="side-link" href="m07_profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>我的</a>
    <a class="side-link" href="../公開網站/p01_home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>回官網</a>
  </nav>

  <header class="topbar">
    <div class="topbar-left">
      <a class="topbar-logo-wrap" href="../公開網站/p01_home.html" aria-label="TLI 官網"><img src="../assets/tli-logo.svg" alt="TLI"></a>
      <button class="back-btn" onclick="if(history.length>1){history.back();}else{location.href='m09_assessment.html';}" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="topbar-title" data-i18n-zh="線上測驗" data-i18n-en="Online Quiz">線上測驗</div>
    </div>
    <div class="topbar-actions">
      <a class="explore-link" href="../公開網站/p02_courses.html" aria-label="探索課程" title="探索課程">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        <span class="explore-link-text">探索課程</span>
      </a>
      <select class="mini-select" id="langSelect" aria-label="語言與幣別" onchange="handleLangCurrency(this)"><option value="TWD">中文・TWD</option><option value="USD">English・USD</option><option value="JPY">日本語・JPY</option></select>
      <button class="bell-btn" onclick="toggleBell()" aria-label="通知">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="dot"></span>
      </button>
      <div class="bell-panel" id="bellPanel">
        <h4>通知</h4>
        <div class="bell-item"><span class="b-dot"></span><div><p>你有 4 份測驗尚未完成</p><span>今天 09:20</span></div></div>
      </div>
    </div>
  </header>

  <main class="content">

    <!-- ===== 狀態 A：測驗列表 ===== -->

var ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 11-5.9-9.1"/><path d="M22 4L12 14.01l-3-3"/></svg>';

var ICON_CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';

var QUIZZES = {

};

var QUESTIONS = [
  {type:'single',skill:'讀',text:'請選出正確的量詞：一___咖啡',options:['杯','個','隻','張'],answer:0,explain:'液體飲料常用量詞為「杯」，如一杯咖啡、一杯茶。'},
  {type:'single',skill:'讀',text:'「開會」最貼近的英文翻譯是？',options:['have a meeting','have a party','have dinner','take a class'],answer:0,explain:'「開會」指召開會議，對應 have a meeting。'},
  {type:'multi',skill:'說',text:'以下哪些是商務會議常用開場白？（可複選）',options:['我們開始吧','大家好，謝謝撥冗出席','你吃飽了嗎','今天議程如下'],answer:[0,1,3],explain:'「你吃飽了嗎」屬日常寒暄，非正式會議開場用語。'},

  {type:'fill',skill:'寫',text:'請完成句子：我今天要「＿＿」會議紀錄。',answer:['整理'],explain:'「整理會議紀錄」為常見商務用語搭配。'},
  {type:'listening',skill:'聽',text:'請聽對話，選出正確答案：對話中提到的會議時間是？',options:['上午九點','下午兩點','晚上七點','中午十二點'],answer:1,explain:'對話中提及「我們下午兩點在三樓會議室見」。'},
  {type:'listening',skill:'聽',text:'請聽對話，選出正確答案：說話者建議在哪裡用餐？',options:['公司樓下','會議室','餐廳','飯店'],answer:2,explain:'對話結尾提到「會議後我們去附近的餐廳吃飯吧」。'},
  {type:'single',skill:'說',text:'「麻煩您」這句話主要用來表達什麼？',options:['命令','請求','拒絕','道謝'],answer:1,explain:'「麻煩您」是禮貌性請求他人協助的用語。'}
];

var lState = {tab:'pending'};
var aState = null; /* 作答狀態 */

function renderQuizList(){
  var pend = Object.keys(QUIZZES).map(function(k){return QUIZZES[k];}).filter(function(q){return q.status==='pending';});
  var done = Object.keys(QUIZZES).map(function(k){return QUIZZES[k];}).filter(function(q){return q.status==='done';});
  document.getElementById('pendingList').innerHTML = pend.map(pendingCardHtml).join('');
  document.getElementById('doneList').innerHTML = done.map(doneCardHtml).join('');
}
function pendingCardHtml(q){
  return '' +
    '<div class="card quiz-card">' +
      '<span class="badge badge-info">'+q.source+'</span>' +
      '<h3 style="margin:8px 0 4px;font-size:15.5px;">'+q.title+'</h3>' +
      '<p class="small muted" style="margin:0;">共 '+q.count+' 題・預估 '+q.mins+' 分鐘・期限 '+q.due+'</p>' +
      '<div class="flex-between" style="margin-top:12px;">' +
        '<span class="small muted">尚未作答</span>' +
        '<button class="btn btn-accent btn-sm" onclick="startQuiz(\''+q.id+'\')">開始作答</button>' +
      '</div>' +
    '</div>';
}
function doneCardHtml(q){
  return '' +
    '<div class="card quiz-card">' +
      '<span class="badge badge-info">'+q.source+'</span>' +
      '<h3 style="margin:8px 0 4px;font-size:15.5px;">'+q.title+'</h3>' +
      '<p class="small muted" style="margin:0;">共 '+q.count+' 題・完成日 '+q.doneDate+'</p>' +
      '<div class="flex-between" style="margin-top:12px;">' +
        '<span><span class="badge badge-ok">'+q.score+' 分</span> <span class="badge badge-info">TLI-CPT '+q.level+'</span></span>' +
        '<button class="btn btn-outline btn-sm" onclick="startQuiz(\''+q.id+'\')">查看結果</button>' +
      '</div>' +
    '</div>';
}
function setListTab(name,btn){
  lState.tab=name;
  document.querySelectorAll('#view-list .tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.querySelectorAll('#view-list .tab-panel').forEach(function(p){p.classList.remove('active');});
  document.getElementById('tabpanel-'+name).classList.add('active');
}

/* ================= 作答流程 ================= */
function startQuiz(id){
  var q = QUIZZES[id];
  if(q.status==='done'){ showResultDirect(q); return; }
  aState = {
    quizId:id, idx:0, answers:{}, flags:{}, secLeft:15*60, timerId:null
  };
  document.getElementById('view-list').classList.add('hidden');
  document.getElementById('view-result').classList.add('hidden');
  document.getElementById('view-answer').classList.remove('hidden');
  document.getElementById('answerTitle').textContent = q.title;
  renderQNav();
  renderQuestion();
  startTimer();
  window.scrollTo(0,0);
}
function backToQuizList(){
  stopTimer();
  aState = null;
  document.getElementById('view-answer').classList.add('hidden');
  document.getElementById('view-result').classList.add('hidden');
  document.getElementById('view-list').classList.remove('hidden');
  renderQuizList();
  window.scrollTo(0,0);
}
function startTimer(){
  stopTimer();
  updateTimerDisplay();
  aState.timerId = setInterval(function(){
    if(!aState) return;
    aState.secLeft--;
    if(aState.secLeft<=0){ aState.secLeft=0; updateTimerDisplay(); stopTimer(); openSubmitConfirm(); return; }
    updateTimerDisplay();
  },1000);
}
function stopTimer(){ if(aState && aState.timerId){ clearInterval(aState.timerId); aState.timerId=null; } }
function updateTimerDisplay(){
  var m=Math.floor(aState.secLeft/60), s=aState.secLeft%60;
  var el=document.getElementById('qTimer');
  el.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  el.classList.toggle('low', aState.secLeft<=60);
}
function renderQNav(){
  var wrap = document.getElementById('qNav');
  wrap.innerHTML = QUESTIONS.map(function(q,i){
    var cls='';
    if(aState.answers[i]!==undefined) cls+=' answered';
    if(i===aState.idx) cls+=' current';
    if(aState.flags[i]) cls+=' flagged';
    return '<button class="'+cls.trim()+'" onclick="jumpQuestion('+i+')">'+(i+1)+'</button>';
  }).join('');
  var answeredCount = Object.keys(aState.answers).length;
  document.getElementById('qProgressBar').style.width = Math.round(answeredCount/QUESTIONS.length*100)+'%';
}
function jumpQuestion(i){ aState.idx=i; renderQuestion(); renderQNav(); }
function stepQuestion(delta){
  var next=aState.idx+delta;
  if(next<0||next>=QUESTIONS.length) return;
  aState.idx=next; renderQuestion(); renderQNav();
}
function toggleFlag(){
  aState.flags[aState.idx] = !aState.flags[aState.idx];
  document.getElementById('qFlagBtn').classList.toggle('on', !!aState.flags[aState.idx]);
  renderQNav();
}
var TYPE_LABEL = {single:'單選題',multi:'多選題',fill:'填空題',listening:'聽力題'};
function renderQuestion(){
  var q = QUESTIONS[aState.idx];
  document.getElementById('qTypeBadge').textContent = TYPE_LABEL[q.type] + (q.type==='multi'?'（可複選）':'');
  document.getElementById('qText').textContent = (aState.idx+1)+'. '+q.text;
  document.getElementById('qFlagBtn').classList.toggle('on', !!aState.flags[aState.idx]);
  document.getElementById('qPrevBtn').disabled = aState.idx===0;
  document.getElementById('qNextBtn').disabled = aState.idx===QUESTIONS.length-1;

  var body = document.getElementById('qBody');
  var html = '';
  if(q.type==='listening'){
    html += '' +
      '<div class="listen-box" id="listenBox">' +
        '<button class="listen-play" id="listenPlayBtn" onclick="toggleListen()">'+ICON_PLAY_SM+'</button>' +
        '<div class="listen-meta"><div class="lm-title">對話音檔・約 45 秒</div><div class="listen-track"><div id="listenTrackBar"></div></div></div>' +
      '</div>';
  }
  if(q.type==='single' || q.type==='listening'){
    html += q.options.map(function(opt,i){
      var sel = aState.answers[aState.idx]===i;
      return '<div class="option-row'+(sel?' selected':'')+'" onclick="selectSingle('+i+')"><span class="opt-mark circle">'+(sel?ICON_CHECK:'')+'</span>'+opt+'</div>';
    }).join('');
  } else if(q.type==='multi'){
    var cur = aState.answers[aState.idx] || [];
    html += q.options.map(function(opt,i){
      var sel = cur.indexOf(i)>-1;
      return '<div class="option-row'+(sel?' selected':'')+'" onclick="selectMulti('+i+')"><span class="opt-mark square">'+(sel?ICON_CHECK:'')+'</span>'+opt+'</div>';
    }).join('');
  } else if(q.type==='fill'){
    var val = aState.answers[aState.idx] || '';
    html += '<input class="fill-input" type="text" placeholder="請輸入答案" value="'+val.replace(/"/g,'&quot;')+'" oninput="answerFill(this.value)">';
  }
  body.innerHTML = html;
}
function selectSingle(i){ aState.answers[aState.idx]=i; renderQuestion(); renderQNav(); }
function selectMulti(i){
  var cur = aState.answers[aState.idx] ? aState.answers[aState.idx].slice() : [];
  var pos = cur.indexOf(i);
  if(pos>-1) cur.splice(pos,1); else cur.push(i);
  aState.answers[aState.idx] = cur;
  renderQuestion(); renderQNav();
}
function answerFill(v){
  aState.answers[aState.idx] = v;
  renderQNav();
}
var listenTimer=null, listenPct=0;
function toggleListen(){
  var box=document.getElementById('listenBox');
  var btn=document.getElementById('listenPlayBtn');
  var playing = box.classList.contains('playing');
  if(playing){
    box.classList.remove('playing'); btn.innerHTML=ICON_PLAY_SM;
    clearInterval(listenTimer); listenTimer=null;
  }else{
    box.classList.add('playing'); btn.innerHTML=ICON_PAUSE_SM;
    listenPct=0;
    var bar=document.getElementById('listenTrackBar');
    listenTimer=setInterval(function(){
      listenPct+=4;
      if(listenPct>=100){ listenPct=100; clearInterval(listenTimer); listenTimer=null; box.classList.remove('playing'); btn.innerHTML=ICON_PLAY_SM; }
      if(bar) bar.style.width=listenPct+'%';
    },150);
  }
}

/* ================= 交卷 ================= */
function openSubmitConfirm(){
  var answered = Object.keys(aState.answers).length;
  var unanswered = QUESTIONS.length - answered;
  document.getElementById('submitConfirmMeta').textContent = '已作答 '+answered+'／'+QUESTIONS.length+' 題' + (unanswered>0 ? '，尚有 '+unanswered+' 題未作答。' : '，已全部作答完成。');
  document.getElementById('submitConfirmOverlay').classList.remove('hidden');
}
function closeSubmitConfirm(){ document.getElementById('submitConfirmOverlay').classList.add('hidden'); }
function confirmSubmit(){
  closeSubmitConfirm();
  stopTimer();
  var result = scoreQuiz();
  showResult(result, QUIZZES[aState.quizId].title);
}
function scoreQuiz(){
  var correctCount=0;
  var skillTotal={聽:0,說:0,讀:0,寫:0}, skillCorrect={聽:0,說:0,讀:0,寫:0};
  var reviews = QUESTIONS.map(function(q,i){
    var given = aState.answers[i];
    var ok=false;
    if(q.type==='single'||q.type==='listening'){ ok = given===q.answer; }
    else if(q.type==='multi'){
      var g=(given||[]).slice().sort();
      var a=q.answer.slice().sort();
      ok = g.length===a.length && g.every(function(v,idx){return v===a[idx];});
    } else if(q.type==='fill'){
      ok = !!given && q.answer.indexOf(String(given).trim())>-1;
    }
    if(ok) correctCount++;
    skillTotal[q.skill]++; if(ok) skillCorrect[q.skill]++;
    return {q:q, given:given, ok:ok};
  });
  var score = Math.round(correctCount/QUESTIONS.length*100);
  var level = score>=90?'B2':score>=75?'B1':score>=60?'A2+':score>=40?'A2':'A1';
  return {score:score, correctCount:correctCount, total:QUESTIONS.length, level:level, skillTotal:skillTotal, skillCorrect:skillCorrect, reviews:reviews};
}
function showResult(result, title){
  document.getElementById('view-answer').classList.add('hidden');
  document.getElementById('view-list').classList.add('hidden');
  document.getElementById('view-result').classList.remove('hidden');
  document.getElementById('resultTitle').textContent = title + '・結果';
  document.getElementById('resultScore').innerHTML = result.score + '<span>／100</span>';
  document.getElementById('resultRate').textContent = '正確率 '+result.score+'%（答對 '+result.correctCount+'／'+result.total+' 題）';
  document.getElementById('resultLevel').textContent = '對照 TLI-CPT '+result.level;
  renderResultSkills(result);
  renderReview(result);
  window.scrollTo(0,0);
}
function showResultDirect(q){
  /* 已完成測驗直接顯示既有成績（示範資料） */
  document.getElementById('view-list').classList.add('hidden');
  document.getElementById('view-answer').classList.add('hidden');
  document.getElementById('view-result').classList.remove('hidden');
  document.getElementById('resultTitle').textContent = q.title + '・結果';
  document.getElementById('resultScore').innerHTML = q.score + '<span>／100</span>';
  document.getElementById('resultRate').textContent = '正確率 '+q.score+'%・完成日 '+q.doneDate;
  document.getElementById('resultLevel').textContent = '對照 TLI-CPT '+q.level;
  aState = {quizId:q.id, idx:0, answers:{}, flags:{}};
  QUESTIONS.forEach(function(qq,i){
    if(qq.type==='multi') aState.answers[i]=qq.answer.slice();
    else if(qq.type==='fill') aState.answers[i]=qq.answer[0];
    else aState.answers[i]=qq.answer;
  });
  var demoResult = scoreQuiz();
  renderResultSkills(demoResult);
  renderReview(demoResult);
  window.scrollTo(0,0);
}
function renderResultSkills(result){
  var order=['聽','說','讀','寫'];
  document.getElementById('resultSkills').innerHTML = order.map(function(s){
    var t=result.skillTotal[s]||0, c=result.skillCorrect[s]||0;
    var pct = t>0 ? Math.round(c/t*100) : 0;
    return '' +
      '<div class="skill-row">' +
        '<span class="skill-label">'+s+'</span>' +
        '<div class="progress'+(pct<60?' warn':'')+'"><div style="width:'+pct+'%;"></div></div>' +
        '<span class="skill-score">'+c+'／'+t+' 題</span>' +
      '</div>';
  }).join('');
}
function renderReview(result){
  document.getElementById('reviewList').innerHTML = result.reviews.map(function(r,i){
    var q=r.q;
    var yourAns = formatAnswer(q, r.given);
    var correctAns = formatAnswer(q, q.type==='multi'?q.answer:(q.type==='fill'?q.answer[0]:q.answer));
    return '' +
      '<div class="review-item">' +
        '<div class="review-head" onclick="toggleReview('+i+')">' +
          '<div class="icon-box '+(r.ok?'ok':'no')+'">'+(r.ok?ICON_CHECK:ICON_CROSS)+'</div>' +
          '<p>'+(i+1)+'. '+q.text+'</p>' +
        '</div>' +
        '<div class="review-detail" id="reviewDetail'+i+'">' +
          '<p><strong>你的答案：</strong>'+yourAns+'</p>' +
          '<p><strong>正確答案：</strong>'+correctAns+'</p>' +
          '<p><strong>解析：</strong>'+q.explain+'</p>' +
        '</div>' +
      '</div>';
  }).join('');
}
function formatAnswer(q, val){
  if(val===undefined||val===null||val==='') return '（未作答）';
  if(q.type==='single'||q.type==='listening'){ return q.options[val]; }
  if(q.type==='multi'){ return (val||[]).map(function(i){return q.options[i];}).join('、') || '（未作答）'; }
  return String(val);
}
function toggleReview(i){ document.getElementById('reviewDetail'+i).classList.toggle('open'); }
function retakeQuiz(){
  var qid = aState ? aState.quizId : null;
  if(qid && QUIZZES[qid]){
    QUIZZES[qid].status = 'pending';
    startQuiz(qid);
  }else{
    backToQuizList();
  }
}

renderQuizList();
</script>
<div class="toast hidden" id="toast">已完成</div>
</body>
