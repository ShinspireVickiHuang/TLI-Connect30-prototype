<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學生列表｜TLI Connect 3.0 管理後台</title>
<style>
:root{
  --primary:#1B4E8C;--primary-light:#e8f0fa;--accent:#E8792B;--accent-light:#fdf0e6;
  --secondary:#0F9B79;--secondary-light:#e6f5f1;--danger:#D92D20;--danger-light:#fdece9;
  --gray-25:#FCFCFD;--gray-50:#F5F7FA;--gray-100:#F0F2F5;--gray-200:#E4E7EC;--gray-300:#D0D5DD;
  --gray-500:#667085;--gray-700:#344054;--gray-900:#101828;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;color:var(--gray-900);background:var(--gray-50);display:flex;flex-direction:column;min-height:100vh;}
a{color:inherit;text-decoration:none;}
.shell{display:flex;flex:1;min-height:0;width:1440px;max-width:100%;margin:0 auto;background:#fff;box-shadow:0 0 0 1px var(--gray-200);}
.sidebar{width:260px;flex:0 0 260px;background:#fff;border-right:1px solid var(--gray-200);color:var(--gray-700);display:flex;flex-direction:column;transition:width .15s;}
.sidebar .brand{padding:18px 20px 14px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--gray-100);}
.sidebar .brand a{display:block;}
.sidebar .brand img.brand-logo-full{height:26px;width:auto;display:block;}
.sidebar .brand .brand-logo-mark{display:none;font-weight:800;color:var(--primary);font-size:16px;}
.sidebar .brand small{font-size:12px;color:var(--gray-500);}
.sidebar nav{display:flex;flex-direction:column;flex:1;overflow-y:auto;padding:8px 12px;}
.sidebar .sec-label{padding:14px 8px 6px;font-size:11px;color:var(--gray-500);letter-spacing:.05em;font-weight:700;white-space:nowrap;overflow:hidden;}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--gray-700);text-decoration:none;white-space:nowrap;overflow:hidden;}
.sidebar nav a svg{flex-shrink:0;color:var(--gray-500);}
.sidebar nav a:hover{background:var(--gray-50);}
.sidebar nav a.active{background:#E6EEF8;color:var(--primary);font-weight:700;}
.sidebar nav a.active svg{color:var(--primary);}
.sidebar nav a .label{overflow:hidden;text-overflow:ellipsis;}
.sidebar-foot{padding:12px 16px 16px;border-top:1px solid var(--gray-100);font-size:12px;line-height:1.7;color:var(--gray-500);}
.sidebar-foot select{width:100%;margin-top:6px;padding:4px 6px;border-radius:6px;border:1px solid var(--gray-300);font-size:12px;font-family:inherit;background:#fff;color:var(--gray-900);}
.sidebar-foot .logout-link{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;color:var(--gray-500);cursor:pointer;}
.sidebar-foot .logout-link:hover{color:var(--danger);}
.sidebar-foot .logout-link svg{width:14px;height:14px;}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:399;}
.sidebar-backdrop.open{display:block;}
.icon{display:inline-block;flex-shrink:0;vertical-align:-3px;}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#fff;border-bottom:1px solid var(--gray-200);gap:14px;}
.topbar h1{font-size:15px;margin:0;color:var(--gray-700);font-weight:700;white-space:nowrap;}
.topbar-search{flex:1;max-width:340px;position:relative;display:flex;align-items:center;color:var(--gray-400);}
.topbar-search svg{position:absolute;left:10px;}
.topbar-search input{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--gray-200);border-radius:8px;font-size:12.5px;background:var(--gray-50);font-family:inherit;color:var(--gray-900);}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.hamburger-btn{display:none;background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--gray-700);}
.hamburger-btn:hover{background:var(--gray-50);}
.dropdown-wrap{position:relative;}
.bell-btn{position:relative;background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--gray-600);display:flex;}
.bell-btn:hover{background:var(--gray-50);}
.bell-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid #fff;}
.avatar-btn{display:flex;align-items:center;gap:7px;background:none;border:none;cursor:pointer;font-size:13px;color:var(--gray-700);font-family:inherit;padding:5px 8px 5px 5px;border-radius:20px;}
.avatar-btn:hover{background:var(--gray-50);}
.avatar-circle{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.dropdown{position:absolute;top:42px;right:0;background:#fff;border:1px solid var(--gray-200);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.14);min-width:230px;display:none;z-index:200;overflow:hidden;text-align:left;}
.dropdown.open{display:block;}
.dropdown .item{display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:12.5px;color:var(--gray-700);cursor:pointer;border-bottom:1px solid var(--gray-100);}
.dropdown .item svg{flex-shrink:0;color:var(--gray-500);}
.dropdown .item:last-child{border-bottom:none;}
.dropdown .item:hover{background:var(--gray-50);}
.dropdown .item.danger{color:var(--danger);}
.dropdown .item.danger svg{color:var(--danger);}
.dropdown-head{padding:10px 14px;font-size:11.5px;color:var(--gray-500);border-bottom:1px solid var(--gray-100);background:var(--gray-50);}
.stars{display:inline-flex;gap:1px;vertical-align:-3px;color:#F5A623;}
.card{overflow-x:auto;}
@media (max-width:1279px) and (min-width:1024px){
  .sidebar{width:72px;}
  .sidebar .brand{padding:16px 8px;align-items:center;}
  .sidebar .brand img.brand-logo-full{display:none;}
  .sidebar .brand .brand-logo-mark{display:block;}
  .sidebar .brand small{display:none;}
  .sidebar .sec-label{display:none;}
  .sidebar nav a{justify-content:center;padding:10px;}
  .sidebar nav a .label{display:none;}
  .sidebar-foot{padding:10px 8px;text-align:center;}
  .sidebar-foot select,.sidebar-foot .advisor-label,.sidebar-foot .campus-label{display:none;}
  .sidebar-foot .logout-link{justify-content:center;}
  .sidebar-foot .logout-link .label{display:none;}
  .topbar-search{display:none;}
}
@media (max-width:1023px){
  .shell{width:100%;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:400;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 24px rgba(0,0,0,.2);}
  .sidebar.open{transform:translateX(0);}
  .hamburger-btn{display:flex;}
  .topbar-search{display:none;}
}

.kicker{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:4px;letter-spacing:.02em;}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
main{flex:1;padding:20px 28px 40px;overflow-y:auto;}
h1.page-title{font-size:20px;margin:0 0 4px;}
.page-sub{font-size:13px;color:var(--gray-500);margin:0 0 20px;}
.card{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--gray-300);border-radius:8px;font-size:13px;font-family:inherit;}
.filters input{flex:1;min-width:180px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--gray-500);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--gray-200);}
td{padding:10px 10px;border-bottom:1px solid var(--gray-100);vertical-align:middle;}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--gray-50);}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.badge.b{background:#e8f0fa;color:var(--primary);}
.badge.g{background:#e6f5f1;color:var(--secondary);}
.badge.c{background:#fdf0e6;color:var(--accent);}
.badge.bip{background:#f3e8fd;color:#7a3ed9;}
.badge.ok{background:var(--secondary-light);color:var(--secondary);}
.badge.warn{background:#fff4e5;color:#b54708;}
.badge.muted{background:var(--gray-100);color:var(--gray-500);}
.badge.danger{background:var(--danger-light);color:var(--danger);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--gray-300);background:#fff;font-size:12.5px;font-family:inherit;cursor:pointer;color:var(--gray-700);}
.btn:hover{background:var(--gray-50);}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn.sm{padding:4px 10px;font-size:12px;}
.ai-panel{width:340px;flex:0 0 340px;border-left:1px solid var(--gray-200);display:flex;flex-direction:column;background:#fbfbfd;transition:flex-basis .15s,width .15s;}
.ai-panel.collapsed{width:44px;flex:0 0 44px;}
.ai-head{padding:14px 16px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;}
.ai-panel.collapsed .ai-head span,.ai-panel.collapsed .ai-body{display:none;}
.ai-head b{font-size:13px;}
.ai-toggle{background:none;border:none;cursor:pointer;font-size:16px;color:var(--gray-500);}
.ai-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 16px;overflow-y:auto;gap:10px;}
.ai-msg{font-size:12.5px;line-height:1.6;padding:10px 12px;border-radius:10px;max-width:94%;}
.ai-msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-radius:10px 10px 2px 10px;}
.ai-msg.bot{align-self:flex-start;background:var(--gray-100);color:var(--gray-900);border-radius:10px 10px 10px 2px;}
.ai-msg .act{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.ai-quick{display:flex;flex-direction:column;gap:6px;padding:0 16px 10px;}
.ai-quick button{text-align:left;font-size:11.5px;padding:6px 10px;border:1px solid var(--gray-200);border-radius:8px;background:#fff;cursor:pointer;color:var(--gray-700);}
.ai-quick button:hover{border-color:var(--primary);color:var(--primary);}
.ai-input{display:flex;gap:6px;padding:12px 16px;border-top:1px solid var(--gray-200);}
.ai-input input{flex:1;padding:8px 10px;border:1px solid var(--gray-300);border-radius:8px;font-size:12.5px;font-family:inherit;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--gray-900);color:#fff;padding:10px 18px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}
.toast.show{opacity:1;}
.empty{color:var(--gray-500);font-size:12.5px;padding:20px 0;text-align:center;}

.ai-fab-btn{display:none;position:relative;background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--gray-600);}
.ai-fab-btn:hover{background:var(--gray-50);}
.ai-fab-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--secondary);border:1.5px solid #fff;}
.ai-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:440;}
.ai-backdrop.open{display:block;}
.ai-body,.ai-quick,.ai-input{min-width:280px;}
.ai-msg{white-space:normal;}
@media (max-width:1439px){
  .ai-panel{position:fixed;top:56px;right:0;bottom:0;width:360px;flex:0 0 auto;transform:translateX(100%);z-index:450;box-shadow:-8px 0 24px rgba(0,0,0,.14);}
  .ai-panel.collapsed{width:360px;transform:translateX(100%);}
  .ai-panel.open{transform:translateX(0);}
  .ai-fab-btn{display:flex;}
}
@media (max-width:1023px){
  .ai-panel{top:auto;left:0;right:0;bottom:0;width:100%;height:80vh;transform:translateY(100%);box-shadow:0 -8px 24px rgba(0,0,0,.14);border-left:none;border-top:1px solid var(--gray-200);border-radius:14px 14px 0 0;}
  .ai-panel.collapsed{width:100%;transform:translateY(100%);}
  .ai-panel.open{transform:translateY(0);}
}

.login-card{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;cursor:pointer;}
.login-card:hover{background:var(--gray-50);}
.login-card-info{flex:1;min-width:0;}
.login-name{font-size:12.5px;font-weight:700;color:var(--gray-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.role-badge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--primary);background:var(--primary-light);border-radius:999px;padding:1px 7px;margin-top:2px;}
.login-unit{font-size:11px;color:var(--gray-500);margin-top:2px;}
.login-card-chev{color:var(--gray-400);flex-shrink:0;}
.dropdown.upward{position:absolute;bottom:calc(100% + 6px);top:auto;left:0;right:auto;width:230px;}
#roleSelect,#campusSelect{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--gray-200);font-size:12.5px;font-family:inherit;}
.sidebar-foot{position:relative;padding:10px 12px 14px;border-top:1px solid var(--gray-100);}
@media (max-width:1279px) and (min-width:1024px){
  .login-card-info,.login-card-chev{display:none;}
  .login-card{justify-content:center;}
  .dropdown.upward{left:8px;}
}

:root{--navy:#1B4E8C;--orange:#E8792B;--teal:#0F9B79;--g50:#F5F7FA;--g200:#E4E7EC;--g500:#667085;--g900:#101828;}
.shell{display:flex;min-height:100vh;width:100%;background:#fff;}
.sidebar{width:260px;flex-shrink:0;background:#fff;color:var(--g900);padding:18px 0;
border-right:1px solid var(--g200);display:flex;flex-direction:column;transition:width .15s;
position:sticky;top:0;height:100vh;align-self:flex-start;}
.sidebar .brand{padding:0 20px 14px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px;
border-bottom:1px solid var(--g200);margin-bottom:6px;text-decoration:none;color:inherit;cursor:pointer;}
.sidebar .brand-logo{height:28px;width:auto;display:block;}
.sidebar .brand small{display:block;font-weight:400;font-size:12px;color:var(--g500);margin-top:0;text-transform:uppercase;letter-spacing:.04em;}
.sidebar nav{flex:1 1 auto;overflow-y:auto;}
.sidebar nav a,.sidebar nav span.disabled{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;
color:var(--g900);text-decoration:none;position:relative;}
.sidebar nav a .navicon{flex-shrink:0;color:var(--g500);}
.sidebar nav a:hover{background:var(--g50);}
.sidebar nav a.active{background:#E6EEF8;color:var(--navy);font-weight:600;}
.sidebar nav a.active .navicon{color:var(--navy);}
.sidebar .sec-label{padding:16px 20px 4px;font-size:10.5px;color:var(--g500);letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
/* ---- 共用：頂欄與側欄使用者卡 ---- */
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;display:flex;align-items:center;gap:10px;position:relative;}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.4;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-role{font-size:11px;color:var(--g500);}
.sidebar .su-logout{display:block;margin:6px 20px 4px;font-size:12px;color:var(--navy);text-decoration:none;}
.sidebar .su-logout:hover{text-decoration:underline;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;
border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:40;margin:-26px -32px 22px;gap:14px;}
.hamburger{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--g900);padding:4px 6px;margin-right:4px;}
.topbar .tb-title{font-size:15px;font-weight:600;color:var(--g900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-actions{display:flex;align-items:center;gap:14px;position:relative;flex-shrink:0;}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;
padding:6px 10px;width:180px;}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;width:100%;color:var(--g900);}
.tb-searchicon{font-size:12px;color:var(--g500);}
.tb-bellbtn{position:relative;background:none;border:none;cursor:pointer;font-size:17px;padding:4px;line-height:1;}
.tb-dot{position:absolute;top:0;right:0;width:7px;height:7px;background:#C0392B;border-radius:50%;display:none;}
.tb-avatarbtn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;border:none;
cursor:pointer;font-size:13px;font-weight:600;flex-shrink:0;}
.tb-panel{display:none;position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--g200);
border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:50;}
.tb-panel.open{display:block;}
.tb-notifpanel{width:300px;padding:10px;}
.tb-notifpanel .tn-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
padding:4px 6px 8px;border-bottom:1px solid var(--g200);margin-bottom:6px;}
.tb-notifpanel .tn-head a{font-size:11.5px;cursor:pointer;}
.tb-notifitem{padding:8px 6px;border-radius:6px;font-size:12.5px;line-height:1.5;}
.tb-notifitem:hover{background:var(--g50);}
.tb-notifitem.unread{background:#EEF3FA;}
.tb-notifitem .tn-t{color:var(--g500);font-size:11px;margin-top:2px;}
.tb-avatarmenu{width:150px;padding:6px;}
.tb-avatarmenu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.tb-avatarmenu a:hover{background:var(--g50);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
background:#101828;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
opacity:0;pointer-events:none;transition:.2s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;position:relative;}
.su-clickarea{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-info{flex:1;min-width:0;}
.su-name,.su-unit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.5;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-roletag{font-size:10.5px;background:#E6EEF8;color:var(--navy);padding:0 6px;border-radius:8px;display:inline-block;width:fit-content;white-space:nowrap;}
.sidebar-user .su-unit{font-size:11px;color:var(--g500);}
.su-menu{top:auto;bottom:64px;left:14px;right:14px;}
.su-roleswitch,.su-campusswitch{margin:8px 0 0;font-size:11px;color:var(--g500);}
.su-roleswitch select,.su-campusswitch select{width:100%;margin-top:3px;padding:5px 7px;border:1px solid var(--g200);
border-radius:6px;font-size:12px;font-family:inherit;color:var(--g900);}
/* ---- RWD ---- */
@media (max-width:1279px) and (min-width:1024px){
  .sidebar{width:72px;}
  .sidebar .navtext{position:absolute;left:100%;top:50%;transform:translateY(-50%);background:#fff;
    border:1px solid var(--g200);border-radius:6px;padding:6px 10px;font-size:12.5px;white-space:nowrap;
    box-shadow:0 4px 12px rgba(16,24,40,.12);opacity:0;pointer-events:none;transition:opacity .12s;margin-left:6px;color:var(--g900);}
  .sidebar nav a:hover .navtext{opacity:1;}
  .sidebar .brand{align-items:center;overflow:hidden;}
  .sidebar .brand-logo{max-width:100%;width:32px;height:28px;object-fit:cover;object-position:left center;flex-shrink:0;}
  .sidebar .brand-text{display:none;}
  .sidebar .brand small{display:none;}
  .sidebar-user{justify-content:center;}
  .sidebar-user .navtext{display:none;}
  .sidebar .su-logout{text-align:center;}
}
@media (max-width:1023px){
  .hamburger{display:inline-flex;}
  .sidebar{position:fixed;left:-260px;top:0;height:100vh;width:260px;z-index:120;transition:left .2s;}
  .sidebar.open{left:0;}
  .sidebar-backdrop.open{display:block;}
  .shell{width:100%;}
  main{padding:16px 16px 40px;}

function statusBadge(s){
  if(s==='學習中')return '<span class="badge ok">學習中</span>';
  if(s==='停止中')return '<span class="badge muted">停止中</span>';
  return '<span class="badge danger">已流失</span>';
}
function classBadge(c){return '<span class="badge '+c.toLowerCase()+'">'+c+'</span>';}
function activationBadge(a){
  if(a==='未開通') return '<span class="badge warn">未開通</span>';
  return '<span class="badge muted">已開通</span>';
}
function renderStudents(list){
  var body=document.getElementById('stuBody');
  body.innerHTML=list.map(function(s){
    return '<tr class="clickable" onclick="location.href=\'c03_student_detail.html?id='+s.id+'\'">'+
      '<td>'+s.name+'</td><td>'+classBadge(s.cls)+'</td><td>'+s.campus+'校</td>'+
      '<td>'+s.hours+' 堂</td><td>'+s.expire+(s.expire<'2026-08-25'?' <span class="badge warn" style="background:#fff4e5;color:#b54708;">已過期</span>':'')+'</td>'+
      '<td>'+statusBadge(s.status)+'</td>'+
      '<td>'+activationBadge(s.activation)+'</td>'+
      '<td>'+(s.testLevel||'未測驗')+'</td>'+
      '<td><a class="btn sm" href="c03_student_detail.html?id='+s.id+'">查看</a></td></tr>';
  }).join('');
  document.getElementById('emptyRow').style.display=list.length?'none':'block';
}
function tliFilter(){
  var q=document.getElementById('q').value.trim();
  var fc=document.getElementById('fClass').value;
  var fp=document.getElementById('fCampus').value;
  var fs=document.getElementById('fStatus').value;
  var ft=document.getElementById('fTestLevel').value;
  var fa=document.getElementById('fActivation').value;
  var list=STUDENTS.filter(function(s){
    return (!q||s.name.indexOf(q)>-1)&&(!fc||s.cls===fc)&&(!fp||s.campus===fp)&&(!fs||s.status===fs)&&(!ft||(s.testLevel||'未測驗')===ft)&&(!fa||s.activation===fa);
  });
  renderStudents(list);
}
renderStudents(STUDENTS);

function tliToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.classList.remove('show');},2600);}
function tliToggleAI(){
  var panel=document.getElementById('aiPanel');
  var bd=document.getElementById('aiBackdrop');
  if(window.innerWidth<1440){
    panel.classList.toggle('open');
    if(bd)bd.classList.toggle('open');
  }else{
    panel.classList.toggle('collapsed');
  }
}

function tliAppendMsg(role,html){
  var body=document.getElementById('aiBody');
  var d=document.createElement('div');
  d.className='ai-msg '+role;
  d.innerHTML=html;
  body.appendChild(d);
  body.scrollTop=body.scrollHeight;
}
function tliAskDemo(){
  tliAppendMsg('user','哪些學生課時效期 30 天內到期？');

}
function tliAskDemo2(){
  tliAppendMsg('user','哪些學生剩餘課時是 0？');
  var zero=STUDENTS.filter(function(s){return s.hours===0;});
  var list=zero.map(function(s){return s.name+'（'+s.campus+'校）';}).join('、');

}
function tliAskFree(){
  var input=document.getElementById('aiInput');
  var v=input.value.trim();
  if(!v)return;
  tliAppendMsg('user',v);
  input.value='';
  setTimeout(function(){tliAppendMsg('bot','此問題會查詢 3.0 中台與 Park 資料後回覆，可先試試上方常用問題。');},300);
}

function tliToggleDropdown(e,id){

}

  '總公司管理者': 'all',
  '校區主管': ['c01','c08','c02','c04','c09','c06','c07','a01','a05','a12','a07','a10','a14','a16','a17','a18','a19','a20'],
  '行政人員': ['a01','a05','a12','a06','a13','a16','a20'],
  '財務': ['a13','a06','a07','a20'],
  '顧問': ['c01','c08','c02','c04','c09','c06','c07','a01']
};
function tliCurrentRole(){ try{ return localStorage.getItem('tliDemoRole') || '總公司管理者'; }catch(e){ return '總公司管理者'; } }
function tliSetRole(r){ try{ localStorage.setItem('tliDemoRole', r); }catch(e){} }
function applyRoleVisibility(){
  var role = tliCurrentRole();
  var allowed = TLI_ROLE_NAV[role];
  document.querySelectorAll('.sidebar nav a[data-nav]').forEach(function(a){
    var key = a.dataset.nav;
    a.style.display = (allowed === 'all' || allowed.indexOf(key) > -1) ? '' : 'none';
  });
  var tagEl = document.getElementById('suRoleTag');
  if (tagEl) tagEl.textContent = role;
  var unitEl = document.getElementById('suUnit');
  if (unitEl) unitEl.textContent = TLI_ROLE_UNIT[role] || '總公司';
  var campusWrap = document.getElementById('campusSwitchWrap');
  if (campusWrap) campusWrap.style.display = (role === '總公司管理者') ? '' : 'none';
  var sel = document.getElementById('roleSwitcher');
  if (sel) sel.value = role;
  if (typeof onRoleApplied === 'function') onRoleApplied(role);
}
function onRoleSwitch(el){
  tliSetRole(el.value);
  applyRoleVisibility();
  toast('已切換角色為「'+el.value+'」，側欄項目已同步更新');
}
function onCampusSwitch(el){ toast('已切換校區檢視為「'+el.value+'」'); }
function toggleSuMenu(ev){
  ev.stopPropagation();
  closePanel('notifPanel'); closePanel('avatarMenu');
  document.getElementById('suMenu').classList.toggle('open');
}
document.addEventListener('click', function(){ closePanel('suMenu'); });
function initRoleSwitcher(){
  var sel = document.getElementById('roleSwitcher');
  if (sel) sel.innerHTML = TLI_ROLES.map(function(r){ return '<option>'+r+'</option>'; }).join('');
  var csel = document.getElementById('campusSwitcher');
  if (csel) csel.innerHTML = ['全公司','羅斯福','士林','台中','高雄'].map(function(c){return '<option>'+c+'</option>';}).join('');
  applyRoleVisibility();
}
initRoleSwitcher();
/* ================= 共用：頂欄通知／使用者選單／登出／toast（全站同一段） ================= */
var NOTIFS = [
  {t:'訂單 ORD-2026-0102 已逾期 5 天未收款', time:'10 分鐘前', unread:true},
  {t:'銷售方案「學期班 Lv.5–8 一期方案」即將於 1/31 下架', time:'1 小時前', unread:true},
  {t:'內容管理：首頁 Hero 文案已由校區主管發佈', time:'今天 09:12', unread:false},
  {t:'老師黃志遠已切換為留職停薪', time:'昨天', unread:false}
];
function renderNotifPanel(){
  var panel = document.getElementById('notifPanel');
  if (!panel) return;
  var unread = NOTIFS.filter(function(n){return n.unread;}).length;
  var dot = document.getElementById('tbDot');
  if (dot) dot.style.display = unread ? 'block' : 'none';
  panel.innerHTML = '<div class="tn-head"><span>通知（'+unread+' 則未讀）</span><a href="javascript:void(0)" onclick="markAllRead(event)">全部標為已讀</a></div>' +
    NOTIFS.map(function(n){ return '<div class="tb-notifitem'+(n.unread?' unread':'')+'">'+n.t+'<div class="tn-t">'+n.time+'</div></div>'; }).join('');
}
function markAllRead(ev){
  if (ev) ev.stopPropagation();
  NOTIFS.forEach(function(n){ n.unread = false; });
  renderNotifPanel();
}
function toggleNotif(ev){
  ev.stopPropagation();
  closePanel('avatarMenu');
  var p = document.getElementById('notifPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) renderNotifPanel();
}
function toggleAvatarMenu(ev){
  ev.stopPropagation();
  closePanel('notifPanel');
  document.getElementById('avatarMenu').classList.toggle('open');
}
function closePanel(id){
  var el = document.getElementById(id);
  if (el) el.classList.remove('open');
}
document.addEventListener('click', function(){ closePanel('notifPanel'); closePanel('avatarMenu'); });
function doLogout(){ location.href = '../公開網站/p07_login_register.html'; }
function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
renderNotifPanel();
initRoleSwitcher();
</script>
<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
  });
  /* 20260911r：目前頁所屬群組不可被收合到看不到 active 項目 */
  var activeLink = document.querySelector('#sidebar a.active');
  if (activeLink) {
    var activeGroup = activeLink.closest('.navgroup');
    if (activeGroup) activeGroup.classList.remove('collapsed');
  }
})();
</script>
