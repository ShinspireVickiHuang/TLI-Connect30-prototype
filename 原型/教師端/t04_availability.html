<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Connect 3.0 教師端－可授課時段</title>
<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.bell-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-muted);}
.bell-btn svg{width:16px;height:16px;}
.bell-btn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.bell-panel{display:none;position:absolute;right:0;top:40px;width:264px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px 0;z-index:90;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:0;padding:8px 14px 6px;font-size:12.5px;color:var(--c-muted);font-weight:700;}
.bell-item{padding:9px 14px;font-size:12.5px;border-top:1px solid var(--c-border);display:flex;gap:8px;}
.bell-item .b-dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);margin-top:5px;flex:none;}
.bell-item p{margin:0;color:var(--c-text);}
.bell-item span{color:var(--c-muted);font-size:11px;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;}
  .side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:22px;height:22px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:960px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 18px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card{margin-top:12px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.7;}
.banner-info{background:#E6EEF8;color:var(--c-primary-dark);border:1px solid #C7DAF0;}
.banner-info b{color:var(--c-primary);}
.banner-info ul{margin:6px 0 0 18px;padding:0;}
.top-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
.repeat-toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;}
.switch{position:relative;width:42px;height:24px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:var(--c-border);border-radius:20px;transition:.15s;cursor:pointer;}
.switch .track::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.switch input:checked + .track{background:var(--c-secondary);}
.switch input:checked + .track::after{transform:translateX(18px);}
/* ---------- 時段格（教師端專用，沿用共用色票／圓角） ---------- */
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--c-muted);margin-bottom:14px;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--c-border);}
.legend .open{background:rgba(15,155,121,.25);border-color:var(--c-secondary);}
.legend .closed{background:#fff;}
.legend .locked{background:var(--c-primary);border-color:var(--c-primary);}
.legend .flexmark{background:#7C3AED;border-color:#7C3AED;}
.grid-wrap{overflow-x:auto;}
.avail-grid{display:grid;grid-template-columns:56px repeat(7,1fr);gap:4px;min-width:640px;}
.gcell{font-size:11px;color:var(--c-muted);display:flex;align-items:center;justify-content:center;padding:6px 2px;text-align:center;}
.gcell.dowhead{font-weight:700;color:var(--c-text);}
.slot-cell{height:34px;border-radius:var(--radius-sm);border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#98A2B3;position:relative;}
.slot-cell.open{background:rgba(15,155,121,.22);border-color:var(--c-secondary);color:#0B6B52;}
.slot-cell.locked{background:var(--c-primary);border-color:var(--c-primary);color:#fff;cursor:pointer;}
.slot-cell.flexmark::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#7C3AED;}
.gcell.rowlabel{cursor:pointer;border-radius:6px;}
.gcell.rowlabel:hover{background:var(--c-bg);color:var(--c-primary);font-weight:700;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);white-space:nowrap;}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
</style>
</head>
<body>
<div class="app has-side">
  <nav class="side-nav" aria-label="主導覽">
    <div class="side-brand"><a href="../公開網站/p01_home.html" aria-label="回官網"><img src="../assets/tli-logo.svg" alt="TLI"></a></div>
    <a class="side-link" href="t01_today.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10"/></svg>今日</a>
    <a class="side-link" href="t02_schedule.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>課表</a>
    <a class="side-link" href="t07_students.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>學生</a>
    <a class="side-link active" href="t04_availability.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v6M9 17h6"/></svg>時段</a>
    <a class="side-link" href="t06_hours_pay.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>我的</a>
    <a class="side-link" href="../公開網站/p01_home.html" style="margin-top:auto;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>回官網</a>
  </nav>

  <header class="topbar">
    <div class="topbar-left"><a class="topbar-logo-wrap" href="../公開網站/p01_home.html" aria-label="回官網"><img src="../assets/tli-logo.svg" alt="TLI"></a><div class="topbar-title">可授課時段</div></div>
    <div class="topbar-actions">
      <button class="bell-btn" onclick="toggleBell()" aria-label="通知">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="dot"></span>
      </button>
      <div class="bell-panel" id="bellPanel">
        <h4>通知</h4>
        <div class="bell-item"><span class="b-dot"></span><div><p>王同學已預約週四 09:00 時段</p><span>昨天</span></div></div>
      </div>
    </div>
  </header>

  <main class="content">
    <p class="page-sub" style="margin:0 0 14px;">設定你的可授課時段，學生預約會依此規則開放。</p>
    <div class="card">
      <div class="banner banner-info">
        <b>時段規則</b>
        <ul>
          <li>每堂課 50 分鐘（可依課程調整為 30–180 分鐘）</li>
          <li>學生最晚可於課前 <b>2 小時</b>預約已開放時段（提前預約時限）</li>
          <li>時段一旦關閉，需間隔 <b>2 小時</b>後才能重新開放（關閉冷卻）</li>
          <li>已被預約的時段會鎖定，需透過「請假／代課」調整</li>
        </ul>
      </div>

      <div class="top-controls">
        <div class="repeat-toggle">
          <span>重複每週</span>
          <label class="switch"><input type="checkbox" id="repeatSwitch" checked><span class="track"></span></label>
        </div>
        <div class="repeat-toggle">
          <span>標記可帶直播班</span>
          <label class="switch"><input type="checkbox" id="flexMarkSwitch"><span class="track"></span></label>
        </div>
      </div>
      <div class="small muted" id="flexMarkHint" style="margin:-4px 0 12px;">切換為開啟後，點擊「已開放」時段可標記／取消標記為可帶 彈性團體直播班。</div>

      <div class="legend">
        <span><i class="open"></i>已開放</span>
        <span><i class="closed"></i>未開放</span>
        <span><i class="locked"></i>已被預約（鎖定）</span>
        <span><i class="flexmark"></i>可帶直播班</span>
      </div>

      <div class="grid-wrap">
        <div class="avail-grid" id="availGrid"></div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="saveAvailability()">儲存</button>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="t01_today.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10"/></svg>今日</a>
    <a href="t02_schedule.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>課表</a>
    <a href="t07_students.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>學生</a>
    <a href="t04_availability.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v6M9 17h6"/></svg>時段</a>
    <a href="t06_hours_pay.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>我的</a>
  </nav>
</div>

<div class="toast hidden" id="toast"></div>

<script>
function toggleBell(){document.getElementById('bellPanel').classList.toggle('open');}
document.addEventListener('click',function(e){
  if(!e.target.closest('.bell-btn')&&!e.target.closest('.bell-panel'))document.getElementById('bellPanel').classList.remove('open');
});

var days = ['一','二','三','四','五','六','日'];
var times = ['09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];
// 預先鎖定的時段（day index, time index）：字串代表學生縮寫
var locked = {
  '0-0':'王', '0-1':'陳', '1-0':'王', '3-0':'王', '3-6':'陳',
  '2-4':'張', '5-2':'班'
};
// 開放狀態（其餘未列出者預設關閉）
var openState = {
  '0-0':1,'0-1':1,'0-2':1,'1-0':1,'1-2':1,'1-3':1,'1-4':1,'1-5':1,
  '2-4':1,'2-5':1,'2-6':1,'3-0':1,'3-6':1,'3-7':1,
  '4-1':1,'4-2':1,'5-2':1,'5-3':1,'5-4':1
};
// 已標記可帶 彈性團體直播班的時段（僅限已開放時段）
var flexMarked = {'1-4':1,'2-5':1};

var grid = document.getElementById('availGrid');
// header row
grid.appendChild(document.createElement('div'));
days.forEach(function(d){
  var h = document.createElement('div');
  h.className='gcell dowhead';
  h.textContent='週'+d;
  grid.appendChild(h);
});
times.forEach(function(t, ti){
  var lbl = document.createElement('div');
  lbl.className='gcell rowlabel';
  lbl.textContent=t;
  lbl.title='點擊選取整列（'+t+'）';
  lbl.onclick = function(){ toggleRow(ti); };
  grid.appendChild(lbl);
  days.forEach(function(d, di){
    var key = di+'-'+ti;
    var cell = document.createElement('div');
    cell.dataset.key = key;
    if(locked[key] !== undefined){
      cell.className='slot-cell locked';
      cell.textContent = locked[key];
      cell.title = '已被 '+locked[key]+'○○ 預約';
      cell.onclick = function(){
        showToast('此時段已被學生預約，如需調整請至「請假／代課」申請，需經顧問確認');
      };
    }else{
      cell.className='slot-cell'+(openState[key] ? ' open':'')+(flexMarked[key] ? ' flexmark':'');
      cell.textContent = openState[key] ? '開' : '';
      cell.onclick = function(){
        var flexMode = document.getElementById('flexMarkSwitch').checked;
        if(flexMode){
          if(!this.classList.contains('open')){
            showToast('請先開放此時段，才能標記可帶直播班');
            return;
          }
          this.classList.toggle('flexmark');
          showToast(this.classList.contains('flexmark') ? '已標記可帶直播班' : '已取消標記可帶直播班');
        }else{
          this.classList.toggle('open');
          this.textContent = this.classList.contains('open') ? '開' : '';
          if(!this.classList.contains('open')) this.classList.remove('flexmark');
        }
      };
    }
    grid.appendChild(cell);
  });
});

function toggleRow(ti){
  var rowCells = grid.querySelectorAll('.slot-cell[data-key$="-'+ti+'"]');
  var anyClosed = false;
  rowCells.forEach(function(c){
    if(!c.classList.contains('locked') && !c.classList.contains('open')) anyClosed = true;
  });
  rowCells.forEach(function(c){
    if(c.classList.contains('locked')) return;
    if(anyClosed){
      c.classList.add('open');
      c.textContent = '開';
    }else{
      c.classList.remove('open');
      c.textContent = '';
    }
  });
  showToast(anyClosed ? '已整列開放此時段' : '已整列關閉此時段');
}

document.getElementById('repeatSwitch').addEventListener('change', function(){
  showToast(this.checked ? '已設定為：每週重複套用' : '已設定為：僅套用本週');
});

document.getElementById('flexMarkSwitch').addEventListener('change', function(){
  showToast(this.checked ? '標記模式已開啟：點擊已開放時段可標記可帶直播班' : '已回到一般開放／關閉模式');
});

function saveAvailability(){
  var flexCount = grid.querySelectorAll('.slot-cell.flexmark').length;
  showToast('已儲存可授課時段設定（可帶直播班時段：'+flexCount+'）');
}

var toastTimer=null;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.add('hidden');},2400);
}
</script>
</body>
</html>
