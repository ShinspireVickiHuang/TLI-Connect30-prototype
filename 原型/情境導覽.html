<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect 3.0 情境導覽</title>
<style>
  :root{
    --navy:#1B4E8C;--orange:#E8792B;--teal:#0F9B79;
    --purple:#6941C6;--slate:#475467;--pink:#C11574;--gray:#98A2B3;
    --cyan:#0E7090;--indigo:#3E4784;--rust:#93370D;--cobalt:#2D31A6;
    --g50:#F5F7FA;--g100:#F0F2F5;--g200:#E4E7EC;--g500:#667085;--g900:#101828;
    --green:#12805C;--green-bg:#E6F6EE;--orange-bg:#FDECE0;--gray-bg:#F0F2F5;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--g50);color:var(--g900);line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto;padding:36px 20px 80px}
  h1{font-size:26px;margin:0 0 6px}
  .sub{color:var(--g500);margin:0 0 6px;font-size:14px}
  .sub2{color:var(--g500);margin:0 0 22px;font-size:12.5px}
  h2{font-size:19px;margin:0 0 14px;color:var(--navy)}
  h3.overview-title{font-size:13px;color:var(--g500);margin:0 0 10px;font-weight:600}

  /* 總覽三線 */
  .overview-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}
  .overview-card{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:14px 16px}
  .overview-card .oc-name{font-size:13.5px;font-weight:700;color:var(--g900);margin-bottom:6px}
  .overview-card .oc-total{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:4px}
  .overview-card .oc-breakdown{font-size:12px;color:var(--g500)}
  .overview-card .oc-breakdown b.full{color:var(--green)}
  .overview-card .oc-breakdown b.partial{color:var(--orange)}
  .overview-card .oc-breakdown b.none{color:var(--slate)}

  /* 頂部產品線分頁 */
  .product-tabs{display:flex;gap:6px;margin-bottom:24px;border-bottom:2px solid var(--g200)}
  .product-tab{border:none;background:none;font-family:inherit;font-size:15px;font-weight:600;
    color:var(--g500);padding:10px 22px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;
    transition:.12s}
  .product-tab:hover{color:var(--navy)}
  .product-tab.active{color:var(--navy);border-bottom-color:var(--navy)}

  /* 統計格 */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
  .stat-box{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:14px 16px;border-left:4px solid var(--g200)}
  .stat-box.full{border-left-color:var(--green)}
  .stat-box.partial{border-left-color:var(--orange)}
  .stat-box.none{border-left-color:var(--gray)}
  .stat-box .num{font-size:26px;font-weight:700;color:var(--g900)}
  .stat-box .label{font-size:13px;color:var(--g500);margin-top:2px}
  .stats.single{grid-template-columns:minmax(140px,220px)}

  /* 篩選區 */
  .filters{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .filter-group{margin-bottom:12px}
  .filter-group:last-child{margin-bottom:0}
  .filter-label{font-size:12px;color:var(--g500);display:block;margin-bottom:6px}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--g200);background:#fff;color:var(--g500);font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;font-family:inherit;transition:.12s}
  .chip:hover{border-color:var(--navy);color:var(--navy)}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip.active[data-role="hr"]{background:var(--navy);border-color:var(--navy)}
  .chip.active[data-role="guest"]{background:var(--navy);border-color:var(--navy)}
  .chip.active[data-role="student"]{background:var(--teal);border-color:var(--teal)}
  .chip.active[data-role="teacher"]{background:var(--orange);border-color:var(--orange)}
  .chip.active[data-role="consultant"]{background:var(--purple);border-color:var(--purple)}
  .chip.active[data-role="backend"]{background:var(--slate);border-color:var(--slate)}
  .chip.active[data-role="research"]{background:var(--pink);border-color:var(--pink)}
  .chip.active[data-role="institution_admin"]{background:var(--cyan);border-color:var(--cyan)}
  .chip.active[data-role="institution_student"]{background:var(--indigo);border-color:var(--indigo)}
  .chip.active[data-role="agent"]{background:var(--rust);border-color:var(--rust)}
  .chip.active[data-role="backend_finance"]{background:var(--cobalt);border-color:var(--cobalt)}
  .chip.active[data-role="teacher_chat"]{background:var(--orange);border-color:var(--orange)}
  .chip.active[data-status="full"]{background:var(--green);border-color:var(--green)}
  .chip.active[data-status="partial"]{background:var(--orange);border-color:var(--orange)}
  .chip.active[data-status="none"]{background:var(--gray);border-color:var(--gray)}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  .btn-outline{border:1px solid var(--g200);background:#fff;color:var(--g900);font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit}
  .btn-outline:hover{border-color:var(--navy);color:var(--navy)}

  .filter-result{font-size:13px;color:var(--g500);margin:0 0 16px}

  /* 情境卡 */
  .card-list{display:flex;flex-direction:column;gap:12px;margin-bottom:36px}
  .card{background:#fff;border:1px solid var(--g200);border-radius:10px;overflow:hidden;transition:box-shadow .4s ease, background-color .4s ease}
  .card.highlight{box-shadow:0 0 0 3px var(--orange);background:#FFF7EC}
  .card[hidden]{display:none}
  .card-head{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;background:none;border:none;cursor:pointer;text-align:left;font-family:inherit}
  .card-head:hover{background:var(--g50)}
  .card-id{font-weight:700;color:var(--navy);font-size:14px;min-width:38px}
  .card-name{font-size:15px;font-weight:600;color:var(--g900)}
  .card-trigger{font-size:12px;color:var(--g500);background:var(--g100);padding:2px 10px;border-radius:999px}
  .status-badge{font-size:12px;padding:3px 12px;border-radius:999px;font-weight:600;white-space:nowrap}
  .status-badge.full{background:var(--green-bg);color:var(--green)}
  .status-badge.partial{background:var(--orange-bg);color:var(--orange)}
  .status-badge.none{background:var(--gray-bg);color:var(--slate)}
  .chevron{margin-left:auto;width:18px;height:18px;flex:none;transition:transform .15s;color:var(--g500)}
  .card.open .chevron{transform:rotate(180deg)}
  .card-body{padding:0 18px 18px;display:none}
  .card.open .card-body{display:block}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px;font-size:13px}
  .meta-item{background:var(--g50);border-radius:8px;padding:8px 12px}
  .meta-item .k{color:var(--g500);font-size:11px;margin-bottom:2px}
  .meta-item .v{color:var(--g900)}
  .flow-title{font-size:13px;color:var(--g500);margin:0 0 12px;padding:8px 12px;background:var(--g50);border-radius:8px;border-left:3px solid var(--navy)}

  .table-scroll{overflow-x:auto;border:1px solid var(--g200);border-radius:8px}
  table.steps{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
  table.steps th{background:var(--g50);color:var(--g500);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--g200);white-space:nowrap;font-size:12px}
  table.steps td{padding:9px 10px;border-bottom:1px solid var(--g100);vertical-align:top}
  table.steps tr:last-child td{border-bottom:none}
  table.steps tr.step-gap{background:#FFFBF5}
  .step-no{color:var(--g500);font-weight:600}
  .role-badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .role-hr{background:#EAF1FA;color:var(--navy)}
  .role-guest{background:#EAF1FA;color:var(--navy)}
  .role-student{background:#E6F6F1;color:var(--teal)}
  .role-teacher{background:#FDECE0;color:var(--orange)}
  .role-consultant{background:#F1EAFB;color:var(--purple)}
  .role-backend{background:#EEF1F4;color:var(--slate)}
  .role-research{background:#FCE7F3;color:var(--pink)}
  .role-institution_admin{background:#E5F1F5;color:var(--cyan)}
  .role-institution_student{background:#E7E9F4;color:var(--indigo)}
  .role-agent{background:#FBEAE1;color:var(--rust)}
  .role-backend_finance{background:#E9E9FB;color:var(--cobalt)}
  .role-teacher_chat{background:#FDECE0;color:var(--orange)}
  .role-system{background:#F2F4F7;color:var(--gray)}
  .scr-link{color:var(--navy);text-decoration:none;border-bottom:1px dotted var(--navy);font-size:12.5px}
  .scr-link:hover{color:var(--orange);border-color:var(--orange)}
  .scr-note{color:var(--g500);font-size:12px}
  .scr-arrow{color:var(--g500);margin:0 3px}
  .gap-tag{display:inline-block;font-size:12px;color:var(--orange);background:var(--orange-bg);padding:2px 9px;border-radius:6px;font-style:normal}
  .remark-cell{color:var(--g500);font-size:12px;max-width:260px}
  .walk-box{margin-top:14px;font-size:13px;background:var(--g50);border-radius:8px;padding:10px 14px}
  .walk-box .lbl{font-weight:700;color:var(--g900);margin-right:4px}
  .gap-box{margin-top:8px;font-size:13px;background:var(--orange-bg);border-radius:8px;padding:10px 14px;color:#8A4413}
  .gap-box .lbl{font-weight:700;margin-right:4px}
  .variant-box{margin-top:14px;font-size:13px;background:var(--g50);border-radius:8px;padding:10px 14px}
  .variant-box .lbl{font-weight:700;color:var(--g900);display:block;margin-bottom:8px}
  .variant-chip-row{display:flex;flex-wrap:wrap;gap:8px}
  .variant-chip{display:inline-block;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:12.5px;padding:5px 12px;border-radius:999px;text-decoration:none;transition:.12s}
  .variant-chip:hover{background:var(--navy);color:#fff}
  code{background:var(--g100);border-radius:4px;padding:1px 5px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* 缺口清單 */
  .gap-section{margin-bottom:36px}
  .gap-cards{display:flex;flex-direction:column;gap:10px}
  .gap-card{background:#fff;border:1px solid var(--g200);border-left:4px solid var(--orange);border-radius:8px;padding:14px 16px;font-size:13px}
  .gap-card.closed{border-left-color:var(--green)}
  .gap-card .gap-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
  .gap-card .order-num{background:var(--orange);color:#fff;font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .gap-card.closed .order-num{background:var(--green)}
  .gap-card .gap-title{font-size:14.5px;font-weight:600}
  .gap-card dl{margin:0;display:grid;grid-template-columns:56px 1fr;gap:4px 10px}
  .gap-card dt{color:var(--g500);font-size:12px}
  .gap-card dd{margin:0}
  .gap-empty{font-size:13px;color:var(--g500);background:#fff;border:1px solid var(--g200);border-radius:8px;padding:14px 16px}

  /* 矩陣 */
  .matrix-section{margin-bottom:20px}
  .matrix-scroll{overflow-x:auto;border:1px solid var(--g200);border-radius:8px;background:#fff}
  table.matrix{border-collapse:collapse;font-size:12px;min-width:900px}
  table.matrix th,table.matrix td{border:1px solid var(--g100);padding:6px 8px;text-align:center}
  table.matrix thead th{background:var(--g50);color:var(--g500);position:sticky;top:0}
  table.matrix td:first-child,table.matrix th:first-child{position:sticky;left:0;background:var(--g50);font-weight:700;color:var(--navy);z-index:1}
  table.matrix td.on{color:var(--teal);font-weight:700}
  .observations{margin:14px 0 0;padding-left:20px;font-size:13px;color:var(--g900)}
  .observations li{margin:6px 0}

  .header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .header-text{flex:1;min-width:240px}
  .internal-toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--g500);white-space:nowrap;cursor:pointer;user-select:none;background:#fff;border:1px solid var(--g200);border-radius:999px;padding:7px 14px;flex:none}
  .internal-toggle input{cursor:pointer;accent-color:var(--navy)}
  .internal-toggle.active{color:var(--navy);border-color:var(--navy);background:#EAF1FA}

  @media (max-width:480px){
    .wrap{padding:24px 12px 60px}
    .overview-row{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr}
    .card-head{padding:12px}
    .meta-grid{grid-template-columns:1fr}
    .product-tab{padding:10px 14px;font-size:14px}
    .header-row{flex-direction:column}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div class="header-text">
      <h1>Connect 3.0 情境導覽</h1>
      <p class="sub">每個情境的完整操作步驟；從心智圖點「完整操作步驟」會直接跳到對應情境。每個情境下方的「情境變化」可直接開啟該狀態的畫面。</p>
    </div>
    <label class="internal-toggle" id="internalToggleLabel">
      <input type="checkbox" id="internalToggle">
      <span>內部檢核資訊</span>
    </label>
  </div>

  <h3 class="overview-title">三條產品線總覽</h3>
  <div class="overview-row" id="overviewRow"></div>

  <div class="product-tabs" id="productTabs">
    <button class="product-tab active" data-mode="b2b" type="button">B2B 企業培訓</button>
    <button class="product-tab" data-mode="b2c" type="button">B2C 個人線上課</button>
    <button class="product-tab" data-mode="partner" type="button">合作夥伴</button>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">依角色篩選（只顯示該角色參與的情境）</span>
      <div class="chip-row" id="roleChips"></div>
    </div>
    <div class="filter-group" id="statusFilterGroup" hidden>
      <span class="filter-label">依涵蓋狀態篩選</span>
      <div class="chip-row" id="statusChips"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">展開／收合</span>
      <div class="btn-row">
        <button class="btn-outline" id="expandAllBtn" type="button">全部展開</button>
        <button class="btn-outline" id="collapseAllBtn" type="button">全部收合</button>
      </div>
    </div>
  </div>

  <p class="filter-result" id="filterResult"></p>

  <div class="card-list" id="cardList"></div>

  <div class="gap-section" id="gapSection" hidden>
    <h2 id="gapSectionTitle">四、缺口清單（按影響排序）</h2>
    <div class="gap-cards" id="gapList"></div>
  </div>

  <div class="matrix-section" id="matrixSection" hidden>
    <h2>五、情境 × 畫面矩陣</h2>
    <div class="matrix-scroll">
      <table class="matrix" id="matrixTable"></table>
    </div>
    <ul class="observations" id="observations"></ul>
  </div>
</div>

function countStatus(scenarios){
  const counts = { full:0, partial:0, none:0 };
  scenarios.forEach(s => counts[s.statusKey]++);
  return counts;
}

function renderOverview(){
  const el = document.getElementById("overviewRow");
  el.innerHTML = MODE_ORDER.map(key => {
    const m = MODES[key];
    const total = m.data.scenarios.length;
    const breakdown = showInternal ? (() => {
      const counts = countStatus(m.data.scenarios);
      return `<div class="oc-breakdown"><b class="full">${counts.full} 已滿足</b> ／ <b class="partial">${counts.partial} 部分滿足</b> ／ <b class="none">${counts.none} 未涵蓋</b></div>`;
    })() : "";
    return `
    <div class="overview-card">
      <div class="oc-name">${m.label}</div>
      <div class="oc-total">${total} 個情境</div>
      ${breakdown}
    </div>`;
  }).join("");
}

function renderStats(){
  const el = document.getElementById("statsRow");

function renderChips(){
  const roleLabels = activeRoleLabels();
  const roleOrder = activeRoleOrder();
  const roleEl = document.getElementById("roleChips");
  roleEl.innerHTML = `<button class="chip active" data-role="all" type="button">全部角色</button>` +
    roleOrder.map(r => `<button class="chip" data-role="${r}" type="button">${roleLabels[r]}</button>`).join("");
  roleEl.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      roleFilter = btn.dataset.role;
      roleEl.querySelectorAll(".chip").forEach(b => b.classList.toggle("active", b === btn));
      applyFilter();
    });
  });

  const statusGroup = document.getElementById("statusFilterGroup");
  const statusEl = document.getElementById("statusChips");
  statusGroup.hidden = !showInternal;
  if(!showInternal){
    statusEl.innerHTML = "";
    return;
  }
  statusEl.innerHTML = `<button class="chip active" data-status="all" type="button">全部狀態</button>` +
    STATUS_ORDER.map(s => `<button class="chip" data-status="${s}" type="button">${STATUS_LABELS[s]}</button>`).join("");
  statusEl.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      statusFilter = btn.dataset.status;
      statusEl.querySelectorAll(".chip").forEach(b => b.classList.toggle("active", b === btn));
      applyFilter();
    });
  });
}

function screenCellHtml(screenRaw){
  if(screenRaw.gap){
    return `<span class="gap-tag">${screenRaw.text}</span>`;
  }
  const joiner = screenRaw.mode === "chain" ? '<span class="scr-arrow">→</span>' : '<span class="scr-arrow">、</span>';
  return screenRaw.screens.map(s => {
    const note = s.note ? `<span class="scr-note">（${s.note}）</span>` : "";
    return `<a class="scr-link" href="${s.href}" target="_blank" rel="noopener">${s.href}</a>${note}`;
  }).join(joiner);
}

function actorBadgeHtml(step){
  const primary = step.actorRoles[0] || "system";
  return `<span class="role-badge role-${primary}">${step.actor}</span>`;
}

function stepsTableHtml(steps){
  const remarkTh = showInternal ? "<th>備註</th>" : "";
  const rows = steps.map(st => {
    const remarkTd = showInternal ? `<td class="remark-cell">${st.remark}</td>` : "";
    return `
    <tr class="${st.screenRaw.gap ? "step-gap" : ""}">
      <td class="step-no">${st.step}</td>
      <td>${actorBadgeHtml(st)}</td>
      <td>${st.action}</td>
      <td>${screenCellHtml(st.screenRaw)}</td>
      <td>${st.statuschg}</td>
      ${remarkTd}
    </tr>`;
  }).join("");
  return `
    <div class="table-scroll">
      <table class="steps">
        <thead><tr>
          <th>步驟</th><th>操作人員</th><th>操作內容</th><th>對應畫面</th><th>狀態變化</th>${remarkTh}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

/* 情境變化列：把同一情境會出現的不同畫面狀態列成可直接點開的連結，客戶版預設顯示 */
function variantsBoxHtml(s){
  const variants = s.variants || [];
  if(!variants.length) return "";
  const chips = variants.map(v =>
    `<a class="variant-chip" href="${v.href}" target="_blank" rel="noopener" title="${v.note}">${v.label}</a>`
  ).join("");
  return `<div class="variant-box"><span class="lbl">情境變化：</span><div class="variant-chip-row">${chips}</div></div>`;
}

  }).join("");

  el.querySelectorAll(".card-head").forEach(btn => {
    btn.addEventListener("click", () => {
      const card = btn.closest(".card");
      const open = card.classList.toggle("open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  });
}

function applyFilter(){
  const cards = document.querySelectorAll("#cardList .card");
  let visible = 0;
  cards.forEach(card => {
    const roles = card.dataset.roles.split(",");
    const status = card.dataset.status;
    const roleOk = roleFilter === "all" || roles.includes(roleFilter);
    const statusOk = statusFilter === "all" || status === statusFilter;
    const show = roleOk && statusOk;
    card.hidden = !show;
    if(show) visible++;
  });
  document.getElementById("filterResult").textContent = `顯示 ${visible} / ${activeData().scenarios.length} 個情境`;
}

function bindExpandCollapseAll(){
  document.getElementById("expandAllBtn").addEventListener("click", () => {
    document.querySelectorAll("#cardList .card").forEach(card => {
      card.classList.add("open");
      card.querySelector(".card-head").setAttribute("aria-expanded", "true");
    });
  });
  document.getElementById("collapseAllBtn").addEventListener("click", () => {
    document.querySelectorAll("#cardList .card").forEach(card => {
      card.classList.remove("open");
      card.querySelector(".card-head").setAttribute("aria-expanded", "false");
    });
  });
}

function renderGaps(){
  const section = document.getElementById("gapSection");
  section.hidden = !showInternal;
  if(!showInternal){
    document.getElementById("gapSectionTitle").textContent = "";
    document.getElementById("gapList").innerHTML = "";
    return;
  }
  document.getElementById("gapSectionTitle").textContent = MODES[currentMode].gapTitle;
  const el = document.getElementById("gapList");
  const gaps = activeData().gaps;
  if(!gaps || gaps.length === 0){
    el.innerHTML = `<div class="gap-empty">目前無缺口。</div>`;
    return;
  }
  el.innerHTML = gaps.map(g => {
    const closed = !!g.closed;
    const impactLbl = closed ? "原影響" : "影響";
    const suggestLbl = closed ? "補了什麼" : "建議補什麼";
    return `
    <div class="gap-card ${closed ? "closed" : ""}">
      <div class="gap-head">
        <span class="order-num">${g.order}</span>
        <span class="gap-title">${g.gap}</span>
        ${closed ? '<span class="status-badge full">已關閉</span>' : ''}
      </div>
      <dl>
        <dt>${impactLbl}</dt><dd>${g.impact}</dd>
        <dt>${suggestLbl}</dt><dd>${g.suggest}</dd>
        <dt>掛在哪一頁</dt><dd>${g.where}</dd>
      </dl>
    </div>`;
  }).join("");
}

function renderMatrix(){
  const section = document.getElementById("matrixSection");
  section.hidden = !showInternal;
  const el = document.getElementById("matrixTable");
  if(!showInternal){
    el.innerHTML = "";
    document.getElementById("observations").innerHTML = "";
    return;
  }
  const data = activeData();
  const cols = data.matrix.cols;
  const thead = `<thead><tr><th>情境\\畫面</th>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>`;
  const tbody = "<tbody>" + data.scenarios.map(s => {
    const row = data.matrix.rows[s.id] || [];
    const cells = cols.map((c,i) => `<td class="${row[i] ? "on" : ""}">${row[i] ? "V" : ""}</td>`).join("");
    return `<tr><td>${s.id}</td>${cells}</tr>`;
  }).join("") + "</tbody>";
  el.innerHTML = thead + tbody;

  document.getElementById("observations").innerHTML =
    data.observations.map(o => `<li>${o}</li>`).join("");
}

function renderAll(){
  roleFilter = "all";
  statusFilter = "all";
  renderOverview();
  renderStats();
  renderChips();
  renderCards();
  renderGaps();
  renderMatrix();
  applyFilter();
}

function bindInternalToggle(){
  const checkbox = document.getElementById("internalToggle");
  const label = document.getElementById("internalToggleLabel");
  checkbox.addEventListener("change", () => {
    showInternal = checkbox.checked;
    label.classList.toggle("active", showInternal);
    renderAll();
  });
}

function bindProductTabs(){
  const tabs = document.querySelectorAll("#productTabs .product-tab");
  tabs.forEach(btn => {
    btn.addEventListener("click", () => {
      if(btn.dataset.mode === currentMode) return;
      currentMode = btn.dataset.mode;
      tabs.forEach(b => b.classList.toggle("active", b === btn));
      renderAll();
      window.scrollTo({top: 0, behavior: "instant"});
    });
  });
}

function scenarioModeFromId(id){
  const prefix = id.charAt(0).toUpperCase();
  if(prefix === "S") return "b2b";
  if(prefix === "C") return "b2c";
  if(prefix === "P") return "partner";
  return null;
}

function applyHashDeepLink(){
  const raw = location.hash.replace(/^#/, "");
  if(!raw) return;
  const id = raw.toUpperCase();
  const mode = scenarioModeFromId(id);
  if(!mode) return;

  if(mode !== currentMode){
    currentMode = mode;
    document.querySelectorAll("#productTabs .product-tab").forEach(b => {
      b.classList.toggle("active", b.dataset.mode === mode);
    });
    renderAll();
  }

  const card = document.getElementById(id);
  if(!card) return;
  card.classList.add("open");
  const head = card.querySelector(".card-head");
  if(head) head.setAttribute("aria-expanded", "true");
  card.scrollIntoView({behavior: "auto", block: "start"});
  card.classList.add("highlight");
  setTimeout(() => card.classList.remove("highlight"), 2000);
}

renderAll();
bindExpandCollapseAll();
bindProductTabs();
bindInternalToggle();
applyHashDeepLink();
window.addEventListener("hashchange", applyHashDeepLink);
</script>
</body>
</html>
