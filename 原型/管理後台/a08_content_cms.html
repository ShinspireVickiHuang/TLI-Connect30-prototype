<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>內容管理｜TLI Connect 3.0 管理後台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#1B4E8C;--navy-dark:#123a68;--orange:#E8792B;--teal:#0F9B79;
--g50:#F5F7FA;--g200:#E4E7EC;--g500:#667085;--g900:#101828;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
background:var(--g50);color:var(--g900);}
a{color:var(--navy);}
.app{display:flex;min-height:100vh;width:100%;background:#fff;}
.sidebar{width:260px;flex-shrink:0;background:#fff;color:var(--g900);padding:18px 0;
border-right:1px solid var(--g200);display:flex;flex-direction:column;transition:width .15s;
position:sticky;top:0;height:100vh;align-self:flex-start;}
.sidebar .brand{padding:0 20px 14px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px;
border-bottom:1px solid var(--g200);margin-bottom:6px;text-decoration:none;color:inherit;cursor:pointer;}
.sidebar .brand-logo{height:28px;width:auto;display:block;}
.sidebar .brand small{display:block;font-weight:400;font-size:12px;color:var(--g500);margin-top:0;text-transform:uppercase;letter-spacing:.04em;}
.sidebar nav{flex:1 1 auto;overflow-y:auto;}
.sidebar nav a,.sidebar nav span.disabled{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;
color:var(--g900);text-decoration:none;position:relative;}
.sidebar nav a .navicon{flex-shrink:0;color:var(--g500);}
.sidebar nav a:hover{background:var(--g50);}
.sidebar nav a.active{background:#E6EEF8;color:var(--navy);font-weight:600;}
.sidebar nav a.active .navicon{color:var(--navy);}
.sidebar .sec-label{padding:16px 20px 4px;font-size:10.5px;color:var(--g500);letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
.main{flex:1;padding:26px 32px 60px;min-width:0;}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;}
.pagehead h1{font-size:20px;margin:0;}
.pagehead .desc{font-size:12.5px;color:var(--g500);margin-top:5px;line-height:1.6;}
.btn{display:inline-block;background:var(--navy);color:#fff;border:none;padding:8px 14px;
border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit;}
.btn.orange{background:var(--orange);}
.btn.ghost{background:#fff;border:1px solid var(--g200);color:var(--g900);}
.btn.teal{background:var(--teal);}
.btn:disabled,.btn.isdisabled{background:var(--g200)!important;color:var(--g500)!important;
cursor:not-allowed!important;}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.card h2{font-size:15px;margin:0 0 12px;}
.tablewrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;background:var(--g50);color:var(--g500);font-weight:600;padding:10px 12px;
border-bottom:1px solid var(--g200);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--g200);}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover{background:#F8FAFD;}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge.blue{background:#E7EEF8;color:var(--navy);}
.badge.green{background:#E4F5EE;color:var(--teal);}
.badge.orange{background:#FCE9DA;color:var(--orange);}
.badge.grey{background:var(--g200);color:var(--g500);}
.badge.red{background:#FBE7E7;color:#C0392B;}
.formrow{margin-bottom:13px;}
.formrow label{display:block;font-size:12.5px;color:var(--g500);margin-bottom:4px;}
.formrow input,.formrow select,.formrow textarea{width:100%;padding:7px 10px;border:1px solid var(--g200);
border-radius:6px;font-size:13px;box-sizing:border-box;font-family:inherit;}
.small{font-size:12px;color:var(--g500);}
.hint{font-size:11.5px;color:var(--g500);margin-top:3px;}
/* CMS 專用 */
.cms-wrap{display:flex;gap:20px;align-items:flex-start;}
.cms-list{width:266px;flex-shrink:0;}
.blockitem{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--g200);border-radius:8px;
padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:13px;font-family:inherit;}
.blockitem:hover{border-color:#c7d3e6;}
.blockitem.active{border-color:var(--navy);background:#EEF3FA;}
.blockitem .bname{display:block;font-weight:600;margin-bottom:6px;color:var(--g900);}
.blockitem .bmeta{display:flex;justify-content:space-between;align-items:center;}
.cms-editor{flex:1;min-width:0;}
.editorhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px;}
.editorhead h2{font-size:16px;margin:0 0 4px;}
.lang3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.lang3 .langcol label{font-size:11px;color:var(--g500);display:block;margin-bottom:4px;}
.lang3 .langcol input,.lang3 .langcol textarea{width:100%;padding:7px 9px;border:1px solid var(--g200);
border-radius:6px;font-size:12.5px;font-family:inherit;box-sizing:border-box;}
.lang3 .langcol textarea{min-height:64px;resize:vertical;}
.fieldgroup{margin-bottom:16px;}
.fieldgroup>.flabel{font-size:13px;font-weight:600;margin-bottom:8px;display:block;}
.imgph{width:200px;height:110px;border:1px dashed var(--g200);border-radius:8px;background:var(--g50);
display:flex;align-items:center;justify-content:center;color:var(--g500);font-size:12px;cursor:pointer;text-align:center;padding:8px;}
.imgph:hover{border-color:var(--navy);color:var(--navy);}
.itemlist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.itemrow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--g200);
border-radius:8px;padding:9px 12px;cursor:pointer;font-size:13px;}
.itemrow:hover{background:#F8FAFD;}
.itemrow.active{border-color:var(--navy);background:#EEF3FA;}
.switch{position:relative;display:inline-block;width:38px;height:22px;vertical-align:middle;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:var(--g200);border-radius:22px;cursor:pointer;transition:.15s;}
.switch .slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked+.slider{background:var(--teal);}
.switch input:checked+.slider:before{transform:translateX(16px);}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;}
.chiprow button{padding:6px 13px;border-radius:16px;border:1px solid var(--g200);background:#fff;font-size:12.5px;
cursor:pointer;font-family:inherit;}
.chiprow button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.previewbox{display:none;border:1px solid var(--g200);border-radius:8px;padding:16px;background:var(--g50);margin-top:10px;}
.previewbox.open{display:block;}
.previewbox h3{font-size:15px;margin:0 0 6px;}
.previewbox p{font-size:12.5px;color:var(--g500);margin:4px 0 0;}
.savebar{display:flex;gap:10px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--g200);}
.savedhint{font-size:12px;color:var(--teal);display:none;}
.savedhint.show{display:inline;}
/* 自學課程內容 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--g200);margin-bottom:16px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:10px 16px;font-size:13.5px;color:var(--g500);
cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
.tabs button.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600;}
.tabpanel{display:none;}
.tabpanel.active{display:block;}
.courselist{display:flex;flex-direction:column;gap:10px;}
.courseitem{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;
border:1px solid var(--g200);border-radius:10px;padding:14px 16px;cursor:pointer;}
.courseitem:hover{border-color:#c7d3e6;}
.courseitem .cname{font-weight:600;font-size:14px;margin-bottom:4px;color:var(--g900);}
.courseitem .cmeta{font-size:12px;color:var(--g500);}
.chapter-card{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.chapter-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.chapter-top .chandle{cursor:grab;color:var(--g500);flex-shrink:0;}
.chapter-top .cnum{font-size:12px;color:var(--g500);flex-shrink:0;width:18px;}
.chapter-top input[type=text]{flex:1;min-width:140px;padding:7px 10px;border:1px solid var(--g200);
border-radius:6px;font-size:13px;font-family:inherit;box-sizing:border-box;}
.chapter-top select{padding:6px 8px;border:1px solid var(--g200);border-radius:6px;font-size:12.5px;font-family:inherit;}
.chapter-top .cactions{display:flex;gap:4px;}
.chapter-top .cactions button{background:none;border:1px solid var(--g200);border-radius:6px;width:28px;height:28px;
cursor:pointer;color:var(--g500);display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:13px;}
.chapter-top .cactions button:hover:not(:disabled){border-color:var(--navy);color:var(--navy);}
.chapter-top .cactions button:disabled{color:var(--g200);cursor:not-allowed;}
.chapter-fields{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding-left:26px;}
.chapter-fields .cfitem{display:flex;flex-direction:column;gap:3px;}
.chapter-fields .cfitem label{font-size:11px;color:var(--g500);}
.chapter-fields input[type=number]{width:70px;padding:6px 8px;border:1px solid var(--g200);border-radius:6px;
font-size:12.5px;font-family:inherit;box-sizing:border-box;}
.uploadph{border:1px dashed var(--g200);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--g500);
cursor:pointer;white-space:nowrap;}
.uploadph:hover{border-color:var(--navy);color:var(--navy);}
.uploadph.filled{border-color:var(--teal);color:var(--teal);border-style:solid;}
.quizchk{display:flex;flex-direction:row;align-items:center;gap:5px;font-size:12.5px;color:var(--g900);}

.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;display:flex;align-items:center;gap:10px;position:relative;}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.4;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-role{font-size:11px;color:var(--g500);}
.sidebar .su-logout{display:block;margin:6px 20px 4px;font-size:12px;color:var(--navy);text-decoration:none;}
.sidebar .su-logout:hover{text-decoration:underline;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;
border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:40;margin:-26px -32px 22px;gap:14px;}
.hamburger{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--g900);padding:4px 6px;margin-right:4px;}
.topbar .tb-title{font-size:15px;font-weight:600;color:var(--g900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-actions{display:flex;align-items:center;gap:14px;position:relative;flex-shrink:0;}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;
padding:6px 10px;width:180px;}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;width:100%;color:var(--g900);}
.tb-searchicon{font-size:12px;color:var(--g500);}
.tb-bellbtn{position:relative;background:none;border:none;cursor:pointer;font-size:17px;padding:4px;line-height:1;}
.tb-dot{position:absolute;top:0;right:0;width:7px;height:7px;background:#C0392B;border-radius:50%;display:none;}
.tb-avatarbtn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;border:none;
cursor:pointer;font-size:13px;font-weight:600;flex-shrink:0;}
.tb-panel{display:none;position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--g200);
border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:50;}
.tb-panel.open{display:block;}
.tb-notifpanel{width:300px;padding:10px;}
.tb-notifpanel .tn-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
padding:4px 6px 8px;border-bottom:1px solid var(--g200);margin-bottom:6px;}
.tb-notifpanel .tn-head a{font-size:11.5px;cursor:pointer;}
.tb-notifitem{padding:8px 6px;border-radius:6px;font-size:12.5px;line-height:1.5;}
.tb-notifitem:hover{background:var(--g50);}
.tb-notifitem.unread{background:#EEF3FA;}
.tb-notifitem .tn-t{color:var(--g500);font-size:11px;margin-top:2px;}
.tb-avatarmenu{width:150px;padding:6px;}
.tb-avatarmenu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.tb-avatarmenu a:hover{background:var(--g50);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
background:#101828;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
opacity:0;pointer-events:none;transition:.2s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;position:relative;}
.su-clickarea{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-info{flex:1;min-width:0;}
.su-name,.su-unit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.5;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-roletag{font-size:10.5px;background:#E6EEF8;color:var(--navy);padding:0 6px;border-radius:8px;display:inline-block;width:fit-content;white-space:nowrap;}
.sidebar-user .su-unit{font-size:11px;color:var(--g500);}
.su-menu{top:auto;bottom:64px;left:14px;right:14px;}
.su-roleswitch,.su-campusswitch{margin:8px 0 0;font-size:11px;color:var(--g500);}
.su-roleswitch select,.su-campusswitch select{width:100%;margin-top:3px;padding:5px 7px;border:1px solid var(--g200);
border-radius:6px;font-size:12px;font-family:inherit;color:var(--g900);}
/* ---- RWD ---- */
@media (max-width:1279px) and (min-width:1024px){
  .sidebar{width:72px;}
  .sidebar .navtext{position:absolute;left:100%;top:50%;transform:translateY(-50%);background:#fff;
    border:1px solid var(--g200);border-radius:6px;padding:6px 10px;font-size:12.5px;white-space:nowrap;
    box-shadow:0 4px 12px rgba(16,24,40,.12);opacity:0;pointer-events:none;transition:opacity .12s;margin-left:6px;color:var(--g900);}
  .sidebar nav a:hover .navtext{opacity:1;}
  .sidebar .brand{align-items:center;overflow:hidden;}
  .sidebar .brand-logo{max-width:100%;width:32px;height:28px;object-fit:cover;object-position:left center;flex-shrink:0;}
  .sidebar .brand-text{display:none;}
  .sidebar .brand small{display:none;}
  .sidebar-user{justify-content:center;}
  .sidebar-user .navtext{display:none;}
  .sidebar .su-logout{text-align:center;}
}
@media (max-width:1023px){
  .hamburger{display:inline-flex;}
  .sidebar{position:fixed;left:-260px;top:0;height:100vh;width:260px;z-index:120;transition:left .2s;}
  .sidebar.open{left:0;}
  .sidebar-backdrop.open{display:block;}
  .app{width:100%;}
  .main{padding:16px 16px 40px;}
  .topbar{padding:0 16px;margin:-16px -16px 18px;}
  .tb-search{display:none;}
  .drawer{width:100%;max-width:100%;}
}
</style>
<style>
/* ==== 側欄改版 20260826f：呼吸感間距／分段收合／底部卡收攏（覆寫舊樣式，回應主管截圖回饋） ==== */
#sidebar{padding:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#sidebar .brand{padding:16px 20px 14px;}
#sidebar .brand-logo{height:28px;width:auto;object-fit:contain;object-position:left center;}
#sidebar .brand small{margin-top:12px;font-size:12px;color:var(--g500);text-transform:none;letter-spacing:0;font-weight:400;}
#sidebar .brand-text{display:none;}
#sidebar nav{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:4px 8px 8px;scrollbar-width:thin;}
#sidebar nav::-webkit-scrollbar{width:6px;}
#sidebar nav::-webkit-scrollbar-thumb{background:var(--g200);border-radius:3px;}
#sidebar nav a,#sidebar nav span.disabled{align-items:center;gap:12px;height:40px;padding:0 14px;margin:2px 0;border-radius:8px;font-size:14px;}
#sidebar .navgroup .sec-label{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px;margin:20px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#98A2B3;font-weight:600;}
#sidebar .navgroup:first-child .sec-label{margin-top:8px;}
#sidebar .sec-toggle{background:none;border:none;padding:2px;margin:0;cursor:pointer;color:var(--g500);display:flex;align-items:center;line-height:1;flex-shrink:0;}
#sidebar .sec-toggle svg{transition:transform .15s;display:block;}
#sidebar .navgroup.collapsed .sec-toggle svg{transform:rotate(-90deg);}
#sidebar .navgroup-items{overflow:hidden;}
#sidebar .navgroup.collapsed .navgroup-items{display:none;}
#sidebar .sidebar-user{display:block;border-top:1px solid var(--g200);padding:10px 12px;margin:0;flex-shrink:0;position:relative;}
#sidebar .su-row{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
#sidebar .su-row .su-avatar{flex-shrink:0;width:36px;height:36px;}
#sidebar .su-row .su-info{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:8px;line-height:1.2;}
#sidebar .su-row .su-name{font-size:14px;font-weight:600;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#sidebar .su-row .su-roletag{font-size:12px;background:#E6EEF8;color:var(--navy);padding:1px 7px;border-radius:8px;white-space:nowrap;flex-shrink:0;}
#sidebar .su-row .su-chevron{color:var(--g500);flex-shrink:0;}
#sidebar .su-menu{top:auto;bottom:60px;left:10px;right:10px;width:auto;padding:8px;}
#sidebar .su-menu .su-roleswitch,#sidebar .su-menu .su-campusswitch{margin:6px 4px 2px;font-size:11px;color:var(--g500);}
#sidebar .su-menu .su-roleswitch select,#sidebar .su-menu .su-campusswitch select{width:100%;margin-top:3px;padding:6px 8px;border:1px solid var(--g200);border-radius:6px;font-size:12.5px;font-family:inherit;color:var(--g900);}
@media (max-width:1279px) and (min-width:1024px){
  #sidebar{width:72px;}
  #sidebar .navgroup .sec-label{display:none;}
  #sidebar .su-row{justify-content:center;}
  #sidebar .su-menu{left:64px;right:auto;bottom:10px;width:210px;}
}
@media (max-width:1023px){
  #sidebar{width:260px;}
}

/* ==== 20260826v 容器寬度統一（對齊 a01 基準，覆寫舊版殘留樣式，防止寬內容撐開頁面）==== */
html,body{overflow-x:hidden;}
.app{display:flex;min-height:100vh;width:100%;max-width:none;background:#fff;}
.main{flex:1;padding:26px 32px 60px;min-width:0;}
.topbar{padding:0 32px;}
.pagehead{padding:0;}
.card{border-radius:12px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.tablewrap,.cal-wrap,.flex-cal-wrap{overflow-x:auto;max-width:100%;}
@media (max-width:1023px){
.app{width:100%;}
.main{padding:16px 16px 40px;}
.topbar{padding:0 16px;}
}
</style>
</head>

var currentBlockId = null;
var currentSubIndex = null;
var previewLang = 'tc';

function statusBadge(s){
  return s === '已發佈' ? '<span class="badge green">已發佈</span>' : '<span class="badge grey">草稿</span>';
}

function renderBlockList(){
  var wrap = document.getElementById('blockList');
  wrap.innerHTML = '';
  BLOCKS.forEach(function(b){
    var st = STORE[b.id].status;
    var div = document.createElement('div');
    div.className = 'blockitem' + (b.id === currentBlockId ? ' active' : '');
    div.innerHTML = '<span class="bname">'+b.name+'</span><div class="bmeta"><span class="small">'+b.page+'</span>'+statusBadge(st)+'</div><div class="hint">更新於 '+b.updated+'</div>';
    div.onclick = function(){ selectBlock(b.id); };
    wrap.appendChild(div);
  });
}

function selectBlock(id){
  currentBlockId = id;
  currentSubIndex = null;
  renderBlockList();
  renderEditor();
}

function blockMeta(id){ return BLOCKS.find(function(b){ return b.id===id; }); }

function langInputsHtml(fieldPath, valueObj, multiline){
  var cols = LANGS.map(function(l){
    var v = (valueObj[l.key]||'').replace(/"/g,'&quot;');
    if (multiline){
      return '<div class="langcol"><label>'+l.label+'</label><textarea data-path="'+fieldPath+'" data-lang="'+l.key+'" oninput="onLangInput(this)">'+v+'</textarea></div>';
    }
    return '<div class="langcol"><label>'+l.label+'</label><input type="text" data-path="'+fieldPath+'" data-lang="'+l.key+'" value="'+v+'" oninput="onLangInput(this)"></div>';
  }).join('');
  return '<div class="lang3">'+cols+'</div>';
}

function onLangInput(el){
  var path = el.dataset.path.split('.');
  var lang = el.dataset.lang;
  var obj = STORE[currentBlockId];
  for (var i=0;i<path.length;i++){ obj = obj[path[i]]; }
  obj[lang] = el.value;
}

function seoFieldsHtml(){
  var seo = STORE[currentBlockId].seo || {title:'',desc:''};
  return '<div class="fieldgroup"><span class="flabel">SEO 欄位</span>' +
    '<div class="formrow"><label>頁面標題（title）</label><input type="text" id="seoTitle" value="'+(seo.title||'')+'" placeholder="顯示於瀏覽器分頁與搜尋結果標題" oninput="STORE[currentBlockId].seo.title=this.value"></div>' +
    '<div class="formrow"><label>頁面描述（description）</label><input type="text" id="seoDesc" value="'+(seo.desc||'')+'" placeholder="顯示於搜尋結果的頁面摘要" oninput="STORE[currentBlockId].seo.desc=this.value"></div></div>';
}

function imageUploadHtml(){
  var s = STORE[currentBlockId];
  var label = s.image ? '已上傳：'+s.image : '點擊上傳圖片';
  return '<div class="fieldgroup"><span class="flabel">圖片</span>' +
    '<div class="imgph" onclick="mockUpload()">'+label+'</div></div>';
}
function mockUpload(){
  STORE[currentBlockId].image = 'banner_'+currentBlockId+'.jpg';
  renderEditor();
}

function saveBarHtml(){
  return '<div class="savebar">' +
    '<button class="btn ghost" onclick="doSave(false)">儲存草稿</button>' +
    '<button class="btn orange" onclick="doSave(true)">發佈</button>' +
    '<button class="btn teal" onclick="togglePreview()">預覽</button>' +
    '<span class="savedhint" id="savedHint">已儲存</span>' +
    '</div>' +
    '<div class="previewbox" id="previewBox"><div class="chiprow" id="previewLangChips"></div><div id="previewContent"></div></div>';
}
function doSave(publish){
  STORE[currentBlockId].status = publish ? '已發佈' : '草稿';
  var meta = blockMeta(currentBlockId);
  meta.updated = '2026-08-25';
  renderBlockList();
  renderEditorHead();
  var hint = document.getElementById('savedHint');
  hint.classList.add('show');
  hint.textContent = publish ? '已發佈' : '已儲存草稿';
  setTimeout(function(){ hint.classList.remove('show'); }, 2500);
}
function renderEditorHead(){
  var el = document.getElementById('editorStatusBadge');
  if (el) el.innerHTML = statusBadge(STORE[currentBlockId].status);
}

function togglePreview(){
  var box = document.getElementById('previewBox');
  box.classList.toggle('open');
  if (box.classList.contains('open')){
    renderPreviewChips();
    renderPreviewContent();
  }
}
function renderPreviewChips(){
  var wrap = document.getElementById('previewLangChips');
  wrap.innerHTML = LANGS.map(function(l){
    return '<button class="'+(l.key===previewLang?'active':'')+'" onclick="setPreviewLang(\''+l.key+'\')">'+l.label+'</button>';
  }).join('');
}
function setPreviewLang(lang){
  previewLang = lang;
  renderPreviewChips();
  renderPreviewContent();
}
function renderPreviewContent(){
  var s = STORE[currentBlockId];
  var html = '';
  var id = currentBlockId;
  if (id === 'hero'){
    html = '<h3>'+s.title[previewLang]+'</h3><p>'+s.subtitle[previewLang]+'</p><p><b>['+s.ctaText[previewLang]+']</b></p>';
  } else if (id === 'teacherintro'){
    html = '<p>'+s.body[previewLang]+'</p>';
  } else if (id === 'promo'){
    html = '<h3>'+s.title[previewLang]+'</h3><p>'+s.body[previewLang]+'</p><p class="small">連結至：'+s.linkBundle+'</p>';
  } else if (id === 'catcards'){
    html = s.items.map(function(it){ return '<p>'+it.icon+' <b>'+it.name[previewLang]+'</b>　'+it.desc[previewLang]+'</p>'; }).join('');
  } else if (id === 'alumni'){
    html = '<h3>'+s.heading[previewLang]+'</h3><p>'+s.subheading[previewLang]+'</p><p class="small">'+s.people.map(function(p){return p.name+'（'+p.title+'）';}).join('、')+'</p>';
  } else if (id === 'faq'){
    html = s.items.map(function(it){ return '<p><b>Q. '+it.q[previewLang]+'</b><br>A. '+it.a[previewLang]+'</p>'; }).join('');
  } else if (id === 'news'){
    html = s.items.map(function(it){ return '<p><b>'+it.title[previewLang]+'</b>（'+it.date+'）<br>'+it.excerpt[previewLang]+'</p>'; }).join('');
  }
  document.getElementById('previewContent').innerHTML = html;
}

/* ---------- 編輯區渲染（依區塊類型） ---------- */
function renderEditor(){
  var wrap = document.getElementById('editorWrap');
  if (!currentBlockId){
    wrap.innerHTML = '<div class="hint">請從左側清單點選要編輯的內容區塊。</div>';
    return;
  }
  var meta = blockMeta(currentBlockId);
  var head = '<div class="editorhead"><div><h2>'+meta.name+'</h2><div class="small">對應頁面：'+meta.page+'</div></div><span id="editorStatusBadge">'+statusBadge(STORE[currentBlockId].status)+'</span></div>';

  var body = '';
  if (currentBlockId === 'hero'){
    body = fieldgroup('主標題', langInputsHtml('title', STORE.hero.title, false)) +
      fieldgroup('副標文案', langInputsHtml('subtitle', STORE.hero.subtitle, true)) +
      fieldgroup('CTA 按鈕文字', langInputsHtml('ctaText', STORE.hero.ctaText, false)) +
      imageUploadHtml() + seoFieldsHtml();
  } else if (currentBlockId === 'teacherintro'){
    body = fieldgroup('介紹文字', langInputsHtml('body', STORE.teacherintro.body, true)) +
      imageUploadHtml() + seoFieldsHtml();
  } else if (currentBlockId === 'promo'){
    body = fieldgroup('Banner 標題', langInputsHtml('title', STORE.promo.title, false)) +
      fieldgroup('Banner 文案', langInputsHtml('body', STORE.promo.body, true)) +
      '<div class="formrow" style="max-width:320px"><label>對應組合包促銷</label><select onchange="STORE.promo.linkBundle=this.options[this.selectedIndex].text"><option'+(STORE.promo.linkBundle.indexOf('新生開學組合')>-1?' selected':'')+'>新生開學組合（bd1）</option><option'+(STORE.promo.linkBundle.indexOf('企業英語方案組合')>-1?' selected':'')+'>企業英語方案組合（bd2）</option></select><div class="hint">選項來自「銷售方案設定」的組合包清單。</div></div>' +
      '<div class="formrow"><label>啟用於首頁</label><label class="switch"><input type="checkbox" id="promoEnabled" '+(STORE.promo.enabled?'checked':'')+' onchange="STORE.promo.enabled=this.checked"><span class="slider"></span></label></div>' +
      imageUploadHtml() + seoFieldsHtml();
  } else if (currentBlockId === 'catcards'){
    body = renderSubList(STORE.catcards.items, function(it){ return it.icon+' '+it.name.tc; }) + renderCatcardForm() + seoFieldsHtml();
  } else if (currentBlockId === 'alumni'){
    body = fieldgroup('區塊標題', langInputsHtml('heading', STORE.alumni.heading, false)) +
      fieldgroup('區塊副標', langInputsHtml('subheading', STORE.alumni.subheading, true)) +
      renderAlumniList() + seoFieldsHtml();
  } else if (currentBlockId === 'faq'){
    body = renderSubList(STORE.faq.items, function(it){ return it.q.tc; }, '新增問答') + renderFaqForm() + seoFieldsHtml();
  } else if (currentBlockId === 'news'){
    body = renderSubList(STORE.news.items, function(it){ return it.title.tc+'（'+it.date+'）'; }, '新增最新消息') + renderNewsForm() + seoFieldsHtml();
  }

  wrap.innerHTML = head + body + saveBarHtml();
}
function fieldgroup(label, innerHtml){
  return '<div class="fieldgroup"><span class="flabel">'+label+'</span>'+innerHtml+'</div>';
}

function renderSubList(items, labelFn, addLabel){
  var rows = items.map(function(it, idx){
    return '<div class="itemrow'+(idx===currentSubIndex?' active':'')+'" onclick="selectSub('+idx+')">'+labelFn(it)+' <span>›</span></div>';
  }).join('');
  var addBtn = addLabel ? '<button class="btn ghost" style="margin-bottom:12px" onclick="addSubItem()">＋ '+addLabel+'</button>' : '';
  return '<div class="fieldgroup"><span class="flabel">項目清單（點擊編輯）</span>' + addBtn + '<div class="itemlist">'+rows+'</div></div>';
}
function selectSub(idx){
  currentSubIndex = idx;
  renderEditor();
  // 保留展開狀態捲動位置
}
function addSubItem(){
  if (currentBlockId === 'faq'){
    STORE.faq.items.push({q:{tc:'新問題',en:'New question',jp:'新しい質問'}, a:{tc:'',en:'',jp:''}});
    currentSubIndex = STORE.faq.items.length - 1;
  } else if (currentBlockId === 'news'){
    STORE.news.items.push({title:{tc:'新消息標題',en:'New announcement',jp:'新しいお知らせ'}, excerpt:{tc:'',en:'',jp:''}, date:'2026-08-25', status:'草稿'});
    currentSubIndex = STORE.news.items.length - 1;
  }
  renderEditor();
}

function renderCatcardForm(){
  if (currentSubIndex === null) return '<div class="hint">請於上方清單點選要編輯的分類卡。</div>';
  var it = STORE.catcards.items[currentSubIndex];
  return fieldgroup('卡片名稱', langInputsHtml('items.'+currentSubIndex+'.name', it.name, false)) +
    fieldgroup('卡片副標', langInputsHtml('items.'+currentSubIndex+'.desc', it.desc, false));
}
function renderFaqForm(){
  if (currentSubIndex === null) return '<div class="hint">請於上方清單點選要編輯的問答，或新增一則。</div>';
  var it = STORE.faq.items[currentSubIndex];
  return fieldgroup('問題', langInputsHtml('items.'+currentSubIndex+'.q', it.q, false)) +
    fieldgroup('答案', langInputsHtml('items.'+currentSubIndex+'.a', it.a, true));
}
function renderNewsForm(){
  if (currentSubIndex === null) return '<div class="hint">請於上方清單點選要編輯的消息，或新增一則。</div>';
  var it = STORE.news.items[currentSubIndex];
  return fieldgroup('標題', langInputsHtml('items.'+currentSubIndex+'.title', it.title, false)) +
    fieldgroup('摘要', langInputsHtml('items.'+currentSubIndex+'.excerpt', it.excerpt, true)) +
    '<div class="formrow" style="max-width:220px"><label>發佈日期</label><input type="date" value="'+it.date+'" onchange="STORE.news.items['+currentSubIndex+'].date=this.value"></div>';
}

function renderAlumniList(){
  var rows = STORE.alumni.people.map(function(p, idx){
    return '<div class="itemrow" style="cursor:default">' +
      '<span>'+p.name+'　<span class="small">'+p.title+'</span></span>' +
      '<span class="small">大頭貼：'+(p.image?'已上傳':'未上傳')+'　<a href="javascript:void(0)" onclick="mockAlumniUpload('+idx+')">上傳</a></span></div>';
  }).join('');
  return '<div class="fieldgroup"><span class="flabel">校友清單</span><div class="itemlist">'+rows+'</div><div class="hint">校友姓名與頭銜為既定史實內容，僅開放更換大頭貼圖片；如需增刪校友請聯繫系統管理者。</div></div>';
}
function mockAlumniUpload(idx){
  STORE.alumni.people[idx].image = 'alumni_'+idx+'.jpg';
  renderEditor();
}

renderBlockList();
selectBlock('hero');

var currentScCourseId = null;
var chDragIdx = null;

function scStatusBadge(s){ return s === '已發佈' ? '<span class="badge green">已發佈</span>' : '<span class="badge grey">草稿</span>'; }
function scById(id){ return SELFSTUDY_COURSES.find(function(c){ return c.id===id; }); }

function renderScList(){
  var wrap = document.getElementById('scListWrap');
  document.getElementById('scDetailWrap').style.display = 'none';
  wrap.style.display = '';
  wrap.innerHTML = '<div class="courselist">' + SELFSTUDY_COURSES.map(function(c){
    return '<div class="courseitem" onclick="openScDetail(\''+c.id+'\')">' +
      '<div><div class="cname">'+c.name+'</div><div class="cmeta">'+c.lang+'／'+c.level+'　·　共 '+c.chapters.length+' 章　·　更新於 '+c.updated+'</div></div>' +
      scStatusBadge(c.status) + '</div>';
  }).join('') + '</div>';
}

function openScDetail(id){
  currentScCourseId = id;
  document.getElementById('scListWrap').style.display = 'none';
  var d = document.getElementById('scDetailWrap');
  d.style.display = '';
  renderScDetail();
}
function closeScDetail(){
  currentScCourseId = null;
  renderScList();
}
function onScSettingField(field, val){
  var c = scById(currentScCourseId);
  c[field] = val;
  if (field === 'allowNotes'){
    var sel = document.getElementById('scNoteVisibilitySel');
    if (sel) sel.disabled = !val;
  }
}
function saveScSettings(){
  toast('課程設定已儲存');
}

function renderScDetail(){
  var c = scById(currentScCourseId);
  var d = document.getElementById('scDetailWrap');
  d.innerHTML =
    '<a href="javascript:void(0)" onclick="closeScDetail()">← 返回自學課程列表</a>' +
    '<div class="editorhead" style="margin-top:10px"><div><h2>'+c.name+'</h2><div class="small">'+c.lang+'／'+c.level+'</div></div>' + scStatusBadge(c.status) + '</div>' +
    '<div style="font-size:13px;font-weight:600;color:var(--g900);margin-bottom:8px">課程設定</div>' +
    '<div class="formrow"><label>允許學生筆記</label><label class="switch"><input type="checkbox" id="scAllowNotesChk" '+(c.allowNotes?'checked':'')+' onchange="onScSettingField(\'allowNotes\',this.checked)"><span class="slider"></span></label></div>' +
    '<div class="formrow"><label>筆記可見範圍</label><select id="scNoteVisibilitySel" '+(c.allowNotes?'':'disabled')+' onchange="onScSettingField(\'noteVisibility\',this.value)"><option value="self"'+(c.noteVisibility==='self'?' selected':'')+'>僅本人</option><option value="teacher"'+(c.noteVisibility==='teacher'?' selected':'')+'>老師可見</option></select></div>' +
    '<button class="btn ghost" style="margin-bottom:14px" onclick="saveScSettings()">儲存設定</button>' +
    '<div class="hint" style="margin-bottom:12px;border-top:1px solid var(--g200);padding-top:14px">章節可拖曳排序，或用上下箭頭調整順序；每章可設定影片、時長、教材附件與是否含測驗題。</div>' +
    '<div id="chapterListWrap"></div>' +
    '<button class="btn ghost" style="margin-top:4px" onclick="addChapter()">＋ 新增章節</button>' +
    '<div class="savebar">' +
      '<button class="btn ghost" onclick="saveScDraft()">儲存草稿</button>' +
      '<button class="btn orange" onclick="publishSc()">發佈課程</button>' +
      '<button class="btn teal" onclick="toggleScPreview()">預覽</button>' +
      '<span class="savedhint" id="scSavedHint">已儲存</span>' +
    '</div>' +
    '<div class="previewbox" id="scPreviewBox"></div>';
  renderChapterList();
}

function renderChapterList(){
  var c = scById(currentScCourseId);
  var wrap = document.getElementById('chapterListWrap');
  wrap.innerHTML = c.chapters.map(function(ch, idx){
    return '<div class="chapter-card" draggable="true" ondragstart="onChDragStart(event,'+idx+')" ondragover="event.preventDefault()" ondrop="onChDrop(event,'+idx+')">' +
      '<div class="chapter-top">' +
      '<svg class="chandle" width="16" height="16" viewBox="0 0 20 20" fill="currentColor" stroke="none"><circle cx="7" cy="5" r="1"/><circle cx="13" cy="5" r="1"/><circle cx="7" cy="10" r="1"/><circle cx="13" cy="10" r="1"/><circle cx="7" cy="15" r="1"/><circle cx="13" cy="15" r="1"/></svg>' +
      '<span class="cnum">'+(idx+1)+'.</span>' +
      '<input type="text" value="'+ch.title.replace(/"/g,'&quot;')+'" oninput="onChField('+idx+',\'title\',this.value)">' +
      '<select onchange="onChField('+idx+',\'status\',this.value)"><option'+(ch.status==='草稿'?' selected':'')+'>草稿</option><option'+(ch.status==='已發佈'?' selected':'')+'>已發佈</option></select>' +
      '<div class="cactions">' +
      '<button title="上移" onclick="moveChapter('+idx+',-1)" '+(idx===0?'disabled':'')+'>&uarr;</button>' +
      '<button title="下移" onclick="moveChapter('+idx+',1)" '+(idx===c.chapters.length-1?'disabled':'')+'>&darr;</button>' +
      '<button title="刪除章節" onclick="deleteChapter('+idx+')">&times;</button>' +
      '</div></div>' +
      '<div class="chapter-fields">' +
      '<div class="cfitem"><label>時長（分鐘）</label><input type="number" min="1" value="'+ch.duration+'" onchange="onChField('+idx+',\'duration\',Number(this.value)||0)"></div>' +
      '<div class="cfitem"><label>影片</label><div class="uploadph'+(ch.video?' filled':'')+'" onclick="onChUploadVideo('+idx+')">'+(ch.video?'已上傳：'+ch.video:'點擊上傳影片（佔位）')+'</div></div>' +
      '<div class="cfitem"><label>教材附件</label><div class="uploadph'+(ch.material?' filled':'')+'" onclick="onChUploadMaterial('+idx+')">'+(ch.material?'已附加：'+ch.material:'點擊附加教材')+'</div></div>' +
      '<label class="quizchk"><input type="checkbox" '+(ch.quiz?'checked':'')+' onchange="onChField('+idx+',\'quiz\',this.checked)"> 含測驗題</label>' +
      '</div></div>';
  }).join('');
}

function onChDragStart(ev, idx){ chDragIdx = idx; ev.dataTransfer.effectAllowed = 'move'; }
function onChDrop(ev, idx){
  ev.preventDefault();
  if (chDragIdx === null || chDragIdx === idx) return;
  var c = scById(currentScCourseId);
  var item = c.chapters.splice(chDragIdx, 1)[0];
  c.chapters.splice(idx, 0, item);
  chDragIdx = null;
  renderChapterList();
}
function onChField(idx, field, val){
  scById(currentScCourseId).chapters[idx][field] = val;
}
function onChUploadVideo(idx){
  scById(currentScCourseId).chapters[idx].video = 'chapter_'+(idx+1)+'_video.mp4';
  renderChapterList();
  toast('已上傳影片');
}
function onChUploadMaterial(idx){
  scById(currentScCourseId).chapters[idx].material = 'chapter_'+(idx+1)+'_material.pdf';
  renderChapterList();
  toast('已附加教材');
}
function moveChapter(idx, dir){
  var c = scById(currentScCourseId);
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= c.chapters.length) return;
  var tmp = c.chapters[idx];
  c.chapters[idx] = c.chapters[newIdx];
  c.chapters[newIdx] = tmp;
  renderChapterList();
}
function deleteChapter(idx){
  var c = scById(currentScCourseId);
  c.chapters.splice(idx, 1);
  renderScDetail();
  toast('已刪除章節');
}
function addChapter(){
  var c = scById(currentScCourseId);
  var n = c.chapters.length + 1;
  c.chapters.push({id:'ch_new'+Date.now(), title:'第 '+n+' 課：新章節', duration:10, video:'', material:'', quiz:false, status:'草稿'});
  renderChapterList();
  toast('已新增章節');
}
function saveScDraft(){
  var c = scById(currentScCourseId);
  c.status = '草稿';
  c.updated = '2026-08-26';
  renderScDetail();
  showScSavedHint('已儲存草稿');
}
function publishSc(){
  var c = scById(currentScCourseId);
  c.status = '已發佈';
  c.updated = '2026-08-26';
  renderScDetail();
  showScSavedHint('已發佈');
  toast('課程已發佈');
}
function showScSavedHint(msg){
  var hint = document.getElementById('scSavedHint');
  if (!hint) return;
  hint.textContent = msg;
  hint.classList.add('show');
  setTimeout(function(){ hint.classList.remove('show'); }, 2200);
}
function toggleScPreview(){
  var box = document.getElementById('scPreviewBox');
  box.classList.toggle('open');
  if (box.classList.contains('open')){
    var c = scById(currentScCourseId);
    box.innerHTML = '<h3>課程大綱預覽</h3>' + c.chapters.map(function(ch, idx){
      return '<p>'+(idx+1)+'. '+ch.title+'　<span class="small">（'+ch.duration+' 分鐘'+(ch.quiz?'／含測驗':'')+'）</span></p>';
    }).join('');
  }
}
renderScList();


function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}
var TLI_ROLES = ['總公司管理者','校區主管','行政人員','財務','顧問'];
var TLI_ROLE_UNIT = {'總公司管理者':'總公司','校區主管':'士林校','行政人員':'士林校','財務':'總公司','顧問':'羅斯福校'};
var TLI_ROLE_NAV = {
  '總公司管理者': 'all',
  '校區主管': ['c01','c08','c02','c04','c09','c06','c07','a01','a05','a12','a07','a10','a14','a16','a17','a18','a19','a20'],
  '行政人員': ['a01','a05','a12','a06','a13','a16','a20'],
  '財務': ['a13','a06','a07','a20'],
  '顧問': ['c01','c08','c02','c04','c09','c06','c07','a01']
};
function tliCurrentRole(){ try{ return localStorage.getItem('tliDemoRole') || '總公司管理者'; }catch(e){ return '總公司管理者'; } }
function tliSetRole(r){ try{ localStorage.setItem('tliDemoRole', r); }catch(e){} }
function applyRoleVisibility(){
  var role = tliCurrentRole();
  var allowed = TLI_ROLE_NAV[role];
  document.querySelectorAll('.sidebar nav a[data-nav]').forEach(function(a){
    var key = a.dataset.nav;
    a.style.display = (allowed === 'all' || allowed.indexOf(key) > -1) ? '' : 'none';
  });
  var tagEl = document.getElementById('suRoleTag');
  if (tagEl) tagEl.textContent = role;
  var unitEl = document.getElementById('suUnit');
  if (unitEl) unitEl.textContent = TLI_ROLE_UNIT[role] || '總公司';
  var campusWrap = document.getElementById('campusSwitchWrap');
  if (campusWrap) campusWrap.style.display = (role === '總公司管理者') ? '' : 'none';
  var sel = document.getElementById('roleSwitcher');
  if (sel) sel.value = role;
  if (typeof onRoleApplied === 'function') onRoleApplied(role);
}
function onRoleSwitch(el){
  tliSetRole(el.value);
  applyRoleVisibility();
  toast('已切換角色為「'+el.value+'」，側欄項目已同步更新');
}
function onCampusSwitch(el){ toast('已切換校區檢視為「'+el.value+'」'); }
function toggleSuMenu(ev){
  ev.stopPropagation();
  closePanel('notifPanel'); closePanel('avatarMenu');
  document.getElementById('suMenu').classList.toggle('open');
}
document.addEventListener('click', function(){ closePanel('suMenu'); });
function initRoleSwitcher(){
  var sel = document.getElementById('roleSwitcher');
  if (sel) sel.innerHTML = TLI_ROLES.map(function(r){ return '<option>'+r+'</option>'; }).join('');
  var csel = document.getElementById('campusSwitcher');
  if (csel) csel.innerHTML = ['全公司','羅斯福','士林','台中','高雄'].map(function(c){return '<option>'+c+'</option>';}).join('');
  applyRoleVisibility();
}
initRoleSwitcher();
/* ---- 共用：頂欄通知／使用者選單／登出／toast（全站同一段） ---- */
var NOTIFS = [
  {t:'訂單 ORD-2026-0102 已逾期 5 天未收款', time:'10 分鐘前', unread:true},
  {t:'銷售方案「學期班 Lv.5–8 一期方案」即將於 1/31 下架', time:'1 小時前', unread:true},
  {t:'內容管理：首頁 Hero 文案已由校區主管發佈', time:'今天 09:12', unread:false},
  {t:'老師黃志遠已切換為留職停薪', time:'昨天', unread:false}
];
function renderNotifPanel(){
  var panel = document.getElementById('notifPanel');
  if (!panel) return;
  var unread = NOTIFS.filter(function(n){return n.unread;}).length;
  var dot = document.getElementById('tbDot');
  if (dot) dot.style.display = unread ? 'block' : 'none';
  panel.innerHTML = '<div class="tn-head"><span>通知（'+unread+' 則未讀）</span><a href="javascript:void(0)" onclick="markAllRead(event)">全部標為已讀</a></div>' +
    NOTIFS.map(function(n){ return '<div class="tb-notifitem'+(n.unread?' unread':'')+'">'+n.t+'<div class="tn-t">'+n.time+'</div></div>'; }).join('');
}
function markAllRead(ev){
  if (ev) ev.stopPropagation();
  NOTIFS.forEach(function(n){ n.unread = false; });
  renderNotifPanel();
}
function toggleNotif(ev){
  ev.stopPropagation();
  closePanel('avatarMenu');
  var p = document.getElementById('notifPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) renderNotifPanel();
}
function toggleAvatarMenu(ev){
  ev.stopPropagation();
  closePanel('notifPanel');
  document.getElementById('avatarMenu').classList.toggle('open');
}
function closePanel(id){
  var el = document.getElementById(id);
  if (el) el.classList.remove('open');
}
document.addEventListener('click', function(){ closePanel('notifPanel'); closePanel('avatarMenu'); });
function doLogout(){ location.href = '../公開網站/p07_login_register.html'; }
function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
renderNotifPanel();
</script>
<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
  });
})();
</script>
