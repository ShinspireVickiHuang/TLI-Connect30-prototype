.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;

.tb-avatarmenu a:hover{background:var(--g50);}

opacity:0;pointer-events:none;transition:.2s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;position:relative;}
.su-clickarea{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-info{flex:1;min-width:0;}
.su-name,.su-unit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.5;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-roletag{font-size:10.5px;background:#E6EEF8;color:var(--navy);padding:0 6px;border-radius:8px;display:inline-block;width:fit-content;white-space:nowrap;}
.sidebar-user .su-unit{font-size:11px;color:var(--g500);}
.su-menu{top:auto;bottom:64px;left:14px;right:14px;}
.su-roleswitch,.su-campusswitch{margin:8px 0 0;font-size:11px;color:var(--g500);}
.su-roleswitch select,.su-campusswitch select{width:100%;margin-top:3px;padding:5px 7px;border:1px solid var(--g200);

<div class="pagehead">
<div><h1>會員分類</h1><div class="desc">分類是會員屬性，用於銷售方案適用對象與報表；付款方式不依分類。</div></div>
<button class="btn" onclick="openCatModal(null)">＋ 新增分類</button>
</div>

<div class="card">
<h2>分類清單</h2>
<div class="tablewrap"><table id="catTable"></table></div>
<div class="hint">拖曳最左側「≡」把手可調整分類排序，排序影響前台與建訂單頁的顯示順序。</div>
</div>

<div class="modal-mask" id="catModal"><div class="modal">
<h3 id="catModalTitle">新增分類</h3>
<div class="formrow"><label>分類代碼</label><input type="text" id="cat_code" placeholder="例：VIP"></div>
<div class="formrow"><label>分類名稱</label><input type="text" id="cat_name" placeholder="例：高階企業會員"></div>
<div class="formrow"><label>說明</label><input type="text" id="cat_desc" placeholder="這個分類代表哪一群會員"></div>
<div class="formrow"><label>適用說明（顯示於銷售方案「適用對象」勾選頁）</label><textarea id="cat_usage" rows="2" placeholder="例：企業補助員工進修方案，個人不可直接購買"></textarea></div>
<div class="formrow"><label>啟用</label><label class="switch"><input type="checkbox" id="cat_enabled" checked><span class="slider"></span></label></div>
<div style="text-align:right;margin-top:10px">
<button class="btn ghost" onclick="closeCatModal()">取消</button>
<button class="btn" onclick="saveCat()">儲存</button>
</div>
</div></div>

<script>

var CATEGORIES = [
 {code:'B', name:'機構／企業', desc:'機構或企業出資之會員，通常對應合約單位', usage:'企業補助員工進修方案，個人不可直接購買', memberCount:974, enabled:true},
 {code:'G', name:'團體／機構', desc:'團體班或機構委訓對應之會員分類', usage:'機構委訓、團體班報名，通常走月結請款', memberCount:2273, enabled:true},
 {code:'C', name:'一般會員', desc:'個人自費報名之一般會員', usage:'開放所有一般銷售方案購買，最主要的會員分類', memberCount:10879, enabled:true},
 {code:'BIP', name:'特定方案會員', desc:'特定活動或試聽方案導入之會員分類', usage:'限定促銷方案、試聽轉換導入使用', memberCount:2111, enabled:true}
];
var editingCode = null;
var dragSrcIndex = null;

function renderCatTable(){
  var t = document.getElementById('catTable');
  t.innerHTML = '<tr><th style="width:30px"></th><th>代碼</th><th>名稱</th><th>說明</th><th>適用說明</th><th>會員數</th><th>啟用</th><th></th></tr>';
  CATEGORIES.forEach(function(c, idx){
    var tr = document.createElement('tr');
    tr.className = 'draggable-row';
    tr.draggable = true;
    tr.dataset.idx = idx;
    tr.innerHTML =
      '<td><span class="draghandle">≡</span></td>' +
      '<td><span class="badge '+((c.code==='B'||c.code==='G')?'blue':'orange')+'">'+c.code+'</span></td>' +
      '<td>'+c.name+'</td>' +
      '<td class="small">'+c.desc+'</td>' +
      '<td class="small">'+c.usage+'</td>' +
      '<td>'+c.memberCount.toLocaleString()+' 人</td>' +
      '<td><label class="switch"><input type="checkbox" '+(c.enabled?'checked':'')+' onchange="toggleCatEnabled('+idx+',this)"><span class="slider"></span></label></td>' +
      '<td><a href="javascript:void(0)" onclick="openCatModal(\''+c.code+'\')">編輯</a></td>';
    attachDragHandlers(tr);
    t.appendChild(tr);
  });
}
function toggleCatEnabled(idx, el){
  CATEGORIES[idx].enabled = el.checked;
  toast(CATEGORIES[idx].name + (el.checked ? ' 已啟用' : ' 已停用'));
}
function openCatModal(code){
  editingCode = code;
  if (code){
    var c = CATEGORIES.find(function(x){return x.code===code;});
    document.getElementById('catModalTitle').textContent = '編輯分類';
    document.getElementById('cat_code').value = c.code;
    document.getElementById('cat_name').value = c.name;
    document.getElementById('cat_desc').value = c.desc;
    document.getElementById('cat_usage').value = c.usage;
    document.getElementById('cat_enabled').checked = c.enabled;
  } else {
    document.getElementById('catModalTitle').textContent = '新增分類';
    document.getElementById('cat_code').value = '';
    document.getElementById('cat_name').value = '';
    document.getElementById('cat_desc').value = '';
    document.getElementById('cat_usage').value = '';
    document.getElementById('cat_enabled').checked = true;
  }
  document.getElementById('catModal').classList.add('open');
}
function closeCatModal(){ document.getElementById('catModal').classList.remove('open'); }
function saveCat(){
  var code = document.getElementById('cat_code').value.trim();
  var name = document.getElementById('cat_name').value.trim();
  if (!code || !name){ toast('請輸入分類代碼與名稱'); return; }
  var desc = document.getElementById('cat_desc').value.trim();
  var usage = document.getElementById('cat_usage').value.trim();
  var enabled = document.getElementById('cat_enabled').checked;
  if (editingCode){
    var c = CATEGORIES.find(function(x){return x.code===editingCode;});
    c.code = code; c.name = name; c.desc = desc; c.usage = usage; c.enabled = enabled;
    toast('已更新分類「'+name+'」');
  } else {
    if (CATEGORIES.some(function(x){return x.code===code;})){ toast('分類代碼已存在'); return; }
    CATEGORIES.push({code:code, name:name, desc:desc, usage:usage, memberCount:0, enabled:enabled});
    toast('已新增分類「'+name+'」');
  }
  closeCatModal();
  renderCatTable();
}

/* 排序拖曳（HTML5 native drag & drop，真的可重新排序） */
function attachDragHandlers(tr){
  tr.addEventListener('dragstart', function(e){
    dragSrcIndex = Number(tr.dataset.idx);
    tr.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  tr.addEventListener('dragend', function(){ tr.classList.remove('dragging'); renderCatTable(); });
  tr.addEventListener('dragover', function(e){ e.preventDefault(); tr.classList.add('dragover'); });
  tr.addEventListener('dragleave', function(){ tr.classList.remove('dragover'); });
  tr.addEventListener('drop', function(e){
    e.preventDefault();
    tr.classList.remove('dragover');
    var destIdx = Number(tr.dataset.idx);
    if (dragSrcIndex === null || dragSrcIndex === destIdx) return;
    var moved = CATEGORIES.splice(dragSrcIndex, 1)[0];
    CATEGORIES.splice(destIdx, 0, moved);
    dragSrcIndex = null;
    renderCatTable();
    toast('已調整分類排序');
  });
}

renderCatTable();

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}
var TLI_ROLES = ['總公司管理者','校區主管','行政人員','財務','顧問'];
var TLI_ROLE_UNIT = {'總公司管理者':'總公司','校區主管':'士林校','行政人員':'士林校','財務':'總公司','顧問':'羅斯福校'};
var TLI_ROLE_NAV = {
  '總公司管理者': 'all',
  '校區主管': ['c01','c08','c02','c04','c06','c07','a01','a05','a12','a07','a10','a14','a16','a17'],
  '行政人員': ['a01','a05','a12','a06','a13','a16'],
  '財務': ['a13','a06','a07'],
  '顧問': ['c01','c08','c02','c04','c06','c07','a01']
};
function tliCurrentRole(){ try{ return localStorage.getItem('tliDemoRole') || '總公司管理者'; }catch(e){ return '總公司管理者'; } }
function tliSetRole(r){ try{ localStorage.setItem('tliDemoRole', r); }catch(e){} }
function applyRoleVisibility(){
  var role = tliCurrentRole();
  var allowed = TLI_ROLE_NAV[role];
  document.querySelectorAll('.sidebar nav a[data-nav]').forEach(function(a){
    var key = a.dataset.nav;
    a.style.display = (allowed === 'all' || allowed.indexOf(key) > -1) ? '' : 'none';
  });
  var tagEl = document.getElementById('suRoleTag');
  if (tagEl) tagEl.textContent = role;
  var unitEl = document.getElementById('suUnit');
  if (unitEl) unitEl.textContent = TLI_ROLE_UNIT[role] || '總公司';
  var campusWrap = document.getElementById('campusSwitchWrap');
  if (campusWrap) campusWrap.style.display = (role === '總公司管理者') ? '' : 'none';
  var sel = document.getElementById('roleSwitcher');
  if (sel) sel.value = role;
  if (typeof onRoleApplied === 'function') onRoleApplied(role);
}
function onRoleSwitch(el){
  tliSetRole(el.value);
  applyRoleVisibility();
  toast('已切換角色為「'+el.value+'」，側欄項目已同步更新');
}
function onCampusSwitch(el){ toast('已切換校區檢視為「'+el.value+'」'); }
function toggleSuMenu(ev){
  ev.stopPropagation();
  closePanel('notifPanel'); closePanel('avatarMenu');
  document.getElementById('suMenu').classList.toggle('open');
}
document.addEventListener('click', function(){ closePanel('suMenu'); });
function initRoleSwitcher(){
  var sel = document.getElementById('roleSwitcher');
  if (sel) sel.innerHTML = TLI_ROLES.map(function(r){ return '<option>'+r+'</option>'; }).join('');
  var csel = document.getElementById('campusSwitcher');
  if (csel) csel.innerHTML = ['全公司','羅斯福','士林','台中','高雄'].map(function(c){return '<option>'+c+'</option>';}).join('');
  applyRoleVisibility();
}
initRoleSwitcher();
/* ---- 共用：頂欄通知／使用者選單／登出／toast（全站同一段） ---- */
var NOTIFS = [
  {t:'訂單 ORD-2026-0102 已逾期 5 天未收款', time:'10 分鐘前', unread:true},
  {t:'銷售方案「學期班 Lv.5–8 一期方案」即將於 1/31 下架', time:'1 小時前', unread:true},
  {t:'內容管理：首頁 Hero 文案已由校區主管發佈', time:'今天 09:12', unread:false},
  {t:'老師黃志遠已切換為留職停薪', time:'昨天', unread:false}
];
function renderNotifPanel(){
  var panel = document.getElementById('notifPanel');
  if (!panel) return;
  var unread = NOTIFS.filter(function(n){return n.unread;}).length;
  var dot = document.getElementById('tbDot');
  if (dot) dot.style.display = unread ? 'block' : 'none';
  panel.innerHTML = '<div class="tn-head"><span>通知（'+unread+' 則未讀）</span><a href="javascript:void(0)" onclick="markAllRead(event)">全部標為已讀</a></div>' +
    NOTIFS.map(function(n){ return '<div class="tb-notifitem'+(n.unread?' unread':'')+'">'+n.t+'<div class="tn-t">'+n.time+'</div></div>'; }).join('');
}
function markAllRead(ev){
  if (ev) ev.stopPropagation();
  NOTIFS.forEach(function(n){ n.unread = false; });
  renderNotifPanel();
}
function toggleNotif(ev){
  ev.stopPropagation();
  closePanel('avatarMenu');
  var p = document.getElementById('notifPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) renderNotifPanel();
}
function toggleAvatarMenu(ev){
  ev.stopPropagation();
  closePanel('notifPanel');
  document.getElementById('avatarMenu').classList.toggle('open');
}
function closePanel(id){
  var el = document.getElementById(id);
  if (el) el.classList.remove('open');
}
document.addEventListener('click', function(){ closePanel('notifPanel'); closePanel('avatarMenu'); });
function doLogout(){ location.href = '../公開網站/p07_login_register.html'; }
function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
renderNotifPanel();

</script>
<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
  });
})();
</script>
